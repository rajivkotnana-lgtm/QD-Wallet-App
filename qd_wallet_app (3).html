<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QD Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16201B; --muted:#56635D; --paper:#EEF2F0; --white:#fff;
  --green:#0E5A42; --green-deep:#083D2D; --green-soft:#DCEBE4;
  --marigold:#F2B000; --marigold-soft:#FFF0C2; --red:#C2313B; --red-soft:#FBE3E4;
  --line:#D3DCD8; --display:'Bricolage Grotesque','Segoe UI',sans-serif; --body:'Public Sans','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--display);line-height:1.15;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}

/* top bar */
.topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--green-deep);color:#fff;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--marigold);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:6px 4px;border-radius:2px;background:var(--green-deep)}
.roles{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
.roles button{border:none;background:none;color:#CFE2D9;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
.sm-l{display:none}
.roles button[aria-pressed=true]{background:#fff;color:var(--green-deep)}
.topbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:#A9C7BA}
.topbar select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:5px 8px}
.topbar select option{color:var(--ink)}
.linkbtn{background:none;border:none;color:#CFE2D9;text-decoration:underline;cursor:pointer;font-size:13px}

/* buttons, inputs */
.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;font-size:14px}
.btn:hover{background:var(--green-deep)}
.btn.ghost{background:var(--white);color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--green-soft)}
.btn.danger{background:var(--white);color:var(--red);border:1.5px solid var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{background:#B9C6C0;color:#fff;border-color:#B9C6C0;cursor:not-allowed}
.btn.block{width:100%;padding:14px;border-radius:12px;font-size:15px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--white)}
.input:focus{border-color:var(--green);outline:none}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}

/* status pills */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.p-ok{background:var(--green-soft);color:var(--green-deep)}
.p-warn{background:var(--marigold-soft);color:#7A5800}
.p-bad{background:var(--red-soft);color:#8E1E26}
.p-neutral{background:#E6EBE9;color:var(--muted)}

/* ===== Rider app ===== */
.rider-stage{display:flex;justify-content:center;gap:40px;padding:28px 20px;align-items:flex-start}
.phone{width:380px;height:780px;border:12px solid #1E2622;border-radius:44px;background:#F7F9F8;overflow:hidden;position:relative;box-shadow:0 24px 50px -24px rgba(8,61,45,.5);display:flex;flex-direction:column}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#1E2622;border-radius:0 0 16px 16px;z-index:5}
.app-scroll{flex:1;overflow-y:auto;padding:38px 18px 18px;display:flex;flex-direction:column;gap:14px}
.app-head{display:flex;justify-content:space-between;align-items:center}
.app-head .who{font-weight:700;font-size:16px}
.app-head .hub{font-size:12.5px;color:var(--muted)}
.back{background:none;border:none;font-weight:700;color:var(--green);cursor:pointer;padding:4px 0;font-size:15px}
.balance{background:var(--green);color:#fff;border-radius:18px;padding:18px}
.balance .lbl{font-size:12.5px;color:#BFDCCF}
.balance .amt{font-family:var(--display);font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 8px}
.balance .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#BFDCCF}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px}
.ocard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ocard .id{font-weight:700}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0}
.kv span:first-child{color:var(--muted)}
.ocard .acts{display:flex;gap:8px;margin-top:10px}
.ocard .acts .btn{flex:1}
.note{border-radius:10px;padding:10px 12px;font-size:13px}
.n-warn{background:var(--marigold-soft)} .n-bad{background:var(--red-soft);color:#8E1E26} .n-ok{background:var(--green-soft);color:var(--green-deep)}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--white)}
.tabbar button{flex:1;border:none;background:none;padding:10px 0 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar button[aria-current=page]{color:var(--green)}
.tabbar button[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--marigold);border-radius:0 0 3px 3px}
.tabbar .dot{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10.5px;line-height:16px;margin-left:3px}
.amount-field{background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.amount-field:focus-within{border-color:var(--green)}
.amount-field small{display:block;color:var(--muted);font-size:12px}
.amount-field .wrap{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:30px;font-weight:800}
.amount-field input{border:none;background:transparent;font:800 30px var(--display);width:100%;outline:none}
.scan{width:220px;height:220px;margin:4px auto;border-radius:20px;background:#1E2622;position:relative;overflow:hidden;display:grid;place-items:center}
.scan .qr{width:130px;height:130px;background:
 linear-gradient(90deg,#fff 0 30%,transparent 30% 40%,#fff 40% 50%,transparent 50% 70%,#fff 70%),
 linear-gradient(0deg,#fff 0 20%,transparent 20% 45%,#fff 45% 60%,transparent 60% 80%,#fff 80%);
 background-blend-mode:difference;opacity:.85;border-radius:4px}
.scan .frame{position:absolute;inset:30px;border:3px solid var(--marigold);border-radius:14px}
.scan .laser{position:absolute;left:34px;right:34px;height:2px;background:var(--marigold);top:40px;animation:laser 1.4s ease-in-out infinite alternate;box-shadow:0 0 10px var(--marigold)}
@keyframes laser{to{top:178px}}
.merchant{display:flex;gap:12px;align-items:center}
.merchant .av{width:42px;height:42px;border-radius:12px;background:var(--marigold-soft);display:grid;place-items:center;font-weight:800;color:#7A5800}
.bill-drop{border:2px dashed var(--line);border-radius:14px;min-height:170px;display:grid;place-items:center;text-align:center;cursor:pointer;background:var(--white);overflow:hidden;position:relative}
.bill-drop img{width:100%;height:220px;object-fit:cover;display:block}
.bill-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.big{width:72px;height:72px;border-radius:50%;margin:26px auto 8px;display:grid;place-items:center;font-size:32px;font-weight:800;color:#fff;background:var(--green)}
.big.wait{background:var(--marigold);color:var(--ink)} .big.no{background:var(--red)}
.center{text-align:center}
.qrshow{width:200px;height:200px;margin:0 auto;border:10px solid #fff;outline:1.5px solid var(--line);border-radius:12px;background:
 repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/20px 20px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.li .t{font-size:12.5px;color:var(--muted)}
.amt-in{color:var(--green);font-weight:700} .amt-out{font-weight:700}
.demo-panel{width:300px;font-size:14px}
.demo-panel .card{margin-bottom:14px}
.demo-panel ol{padding-left:18px}
.demo-panel li{margin:4px 0}

/* ===== Web consoles ===== */
.console{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.cside{background:var(--white);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.cside .ctx{padding:6px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.cside .ctx b{display:block;font-family:var(--display);font-size:17px}
.cside button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:none;background:none;padding:9px 10px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14.5px}
.cside button:hover{background:var(--paper)}
.cside button[aria-current=page]{background:var(--green-soft);color:var(--green-deep)}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:11.5px;padding:0 7px;line-height:18px}
.cmain{padding:26px 30px 60px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi b{display:block;font-family:var(--display);font-size:clamp(18px,1.7vw,25px);font-weight:800;white-space:nowrap}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.alert b{color:var(--red)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;margin-bottom:20px}
.panel > .ph{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel > .pb{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:#F7F9F8}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{border:none;background:none;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--green);color:#fff}
.req{border:1.5px solid var(--marigold);background:#FFFBEE;border-radius:10px;padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:28px;text-align:center;color:var(--muted)}
.feed .li{font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:14px;background:var(--paper);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--green);border-radius:7px}
.bar .fill.alt{background:var(--marigold)}
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--line);vertical-align:middle}
.inline-form{display:flex;gap:6px;align-items:center}
.inline-form .input{width:110px;padding:6px 8px}

/* reconciliation */
.xlist{display:flex;flex-direction:column;gap:12px}
.xc{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.xc.s-waiting,.xc.s-replied{border-left-color:var(--marigold)} .xc.s-resolved{border-left-color:var(--green);opacity:.85}
.xtop{display:flex;justify-content:space-between;gap:14px}
.xtop h3{margin:2px 0}
.xright{display:flex;gap:10px;align-items:flex-start}
.kind{font-size:12.5px;font-weight:600;color:var(--muted)}
.flags{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.flags li{background:var(--red-soft);color:#8E1E26;font-size:12.5px;padding:3px 9px;border-radius:4px}
.xc.s-resolved .flags li{background:#EEF1F0;color:var(--muted)}
.aibox{background:#F4F1FB;border:1px solid #DCD3F0;border-radius:8px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.aitop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.conf{width:80px;height:6px;border-radius:3px;background:#DCD3F0;overflow:hidden;display:inline-block}
.conf span{display:block;height:100%;background:#5B3FA8}
.aibtn{background:#5B3FA8}.aibtn:hover{background:#45307F}
.replybox{background:var(--marigold-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.xacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb.lg{width:52px;height:52px}
.aipanel .pb{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.aip-l{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px}
.aip-r{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:300px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--green)}
.alertc .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.alertc p{font-size:14px;margin-bottom:4px}
.alertc .t{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.mm-banner{display:flex;justify-content:space-between;align-items:center;border:none;cursor:pointer;text-align:left;width:100%;font-size:14px}
.mm-banner span{font-weight:700;text-decoration:underline}
.big.warnk{background:var(--red)}
textarea.input{resize:vertical;min-height:70px}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--green-soft);border-top-color:var(--green);margin:0 auto;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* AI features */
.copilot{margin-top:10px;background:#F4F1FB;border:1px solid #DCD3F0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.spinner.sm{width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px;margin:0 4px 0 0}
.chatpanel{display:flex;flex-direction:column}
.chatlog{padding:18px;display:flex;flex-direction:column;gap:10px;max-height:520px;min-height:260px;overflow-y:auto}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#F4F1FB;border:1px solid #DCD3F0;border-bottom-left-radius:4px}
.msg.ai table{margin-top:8px;background:#fff;font-size:13px}
.msg.ai p{margin:0}
.eng{font-size:11.5px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px}
.chip{border:1.5px solid #DCD3F0;background:#fff;color:#45307F;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{background:#F4F1FB}.chip:disabled{opacity:.5;cursor:default}
.chatin{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.rchat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px}
.app-scroll .chips{padding:0}
.app-scroll .chatin{padding:0;border:none}
.app-scroll .msg{max-width:88%;font-size:14px}
.app-scroll .seg button{padding:5px 8px;font-size:12.5px}

.cashcard{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--marigold);background:#FFFBEE}
.cashcard.warn{border-color:var(--red);background:#FFF5F5}
.cashamt{font:800 24px var(--display)}
.cashrec{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cashrec div{display:flex;flex-direction:column}
.cashrec b{font:800 19px var(--display)}
@media (max-width:900px){.cashrec{grid-template-columns:1fr 1fr}}

/* storytelling */
.logo{background:none;border:none;color:#fff;cursor:pointer}
.story-btn{background:var(--marigold);color:var(--ink)}.story-btn:hover{background:#FFC93C}
.solves{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--green-deep);background:var(--green-soft);border-radius:6px;padding:5px 10px 5px 5px;margin:-8px 0 18px}
.solves span{background:var(--green);color:#fff;font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:4px}
.story{position:fixed;right:20px;bottom:20px;width:390px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-top:5px solid var(--marigold);border-radius:14px;box-shadow:0 22px 50px -18px rgba(8,61,45,.45);padding:16px 18px;z-index:40;display:flex;flex-direction:column;gap:8px}
.story.min{padding:0;border:none;box-shadow:none;background:none;width:auto}
.story-pill{background:var(--green-deep);color:#fff;border:none;border-radius:22px;padding:10px 16px;font-weight:600;cursor:pointer;display:flex;gap:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.story-pill span{color:var(--marigold)}
.story-head{display:flex;justify-content:space-between;align-items:center}
.story-dots{display:flex;gap:4px}
.story-dots span{width:14px;height:4px;border-radius:2px;background:var(--line)}
.story-dots span.past{background:var(--green)}.story-dots span.now{background:var(--marigold);width:22px}
.story-ctl button{background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 6px}
.story-meta{font-size:12.5px;color:var(--muted);font-weight:600}
.story h2{font-size:21px}
.story-who{font-size:13px;color:var(--muted);margin-top:-6px}
.story-pb,.story-pa{font-size:13.5px;border-radius:8px;padding:8px 10px}
.story-pb{background:var(--red-soft);color:#6E1A21}.story-pa{background:var(--green-soft);color:var(--green-deep)}
.story-pb b,.story-pa b{display:block;font-size:11.5px;margin-bottom:2px}
.story-hint{font-size:13px;color:var(--muted)}
.story-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.story-hl{outline:3px solid var(--marigold)!important;outline-offset:3px;animation:hlpulse 1.6s ease-in-out 2}
@keyframes hlpulse{50%{outline-color:rgba(242,176,0,.25)}}
body.story-on .cmain{padding-bottom:300px}
@media (min-width:1300px){body.story-on .cmain{padding-right:440px}}
body.story-on .rider-stage{justify-content:flex-start;padding-left:max(20px,calc(50vw - 520px))}
/* intro */
.intro{min-height:calc(100vh - 56px)}
.intro-hero{background:var(--green);color:#fff;padding:64px clamp(20px,6vw,90px);display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:center}
.intro-hero h1{font-size:clamp(34px,4.4vw,56px);letter-spacing:-.025em;max-width:17ch}
.intro-hero p{font-size:18px;color:#CFE5DB;max-width:58ch;margin-top:18px}
.ih-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.big-cta{padding:14px 22px;font-size:16px;border-radius:10px}
.intro-hero .btn:not(.ghost){background:var(--marigold);color:var(--ink)}.intro-hero .btn:not(.ghost):hover{background:#FFC93C}
.intro-hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.ih-live{background:rgba(0,0,0,.18);border-radius:16px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ih-live h3{grid-column:1/-1;font-size:14px;color:#A9C7BA;font-family:var(--body);font-weight:600}
.ih-live b{display:block;font:800 28px var(--display);color:#fff}.ih-live span{font-size:13px;color:#CFE5DB}
.intro-band{padding:44px clamp(20px,6vw,90px) 8px}
.intro-band h2{font-size:26px;margin-bottom:18px}
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pains > div{padding:20px 22px;border-right:1px solid var(--line)}.pains > div:last-child{border-right:none}
.pains ul{padding-left:18px;margin-top:8px;font-size:15px}.pains li{margin:4px 0}
.pain-ans{background:var(--green-soft)}
.roles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:48px}
.role-card{text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit}
.role-card:hover{border-color:var(--green)}
.rc-av{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.role-card p{font-size:14px;color:var(--muted);flex:1}
.rc-go{font-weight:700;color:var(--green)}
/* analytics */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut .dc{font:800 17px var(--display);fill:var(--ink)}.donut .ds{font-size:10px;fill:var(--muted)}
.legend-l{list-style:none;font-size:13px;flex:1;min-width:150px}
.legend-l li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.legend-l i,.legend-h i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend-h{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend-h span{display:flex;gap:6px;align-items:center}
.colchart{width:100%;height:auto}.colchart .ax{font-size:10.5px;fill:var(--muted)}
.track.tgt{height:8px;background:var(--paper);border-radius:4px;overflow:hidden}.track.tgt .fill{height:100%;border-radius:4px}
.phase-tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.phase-tag.p1{background:var(--green-soft);color:var(--green-deep)}.phase-tag.p2{background:var(--marigold-soft);color:#7A5800}.phase-tag.p3{background:#E6EBE9;color:var(--muted)}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.ins{background:#F4F1FB;border:1px solid #DCD3F0;border-radius:12px;padding:16px 18px;position:relative}
.ins-n{position:absolute;top:14px;right:16px;font:800 28px var(--display);color:#CFC4EC}
.ins h3{font-size:16px;margin-bottom:6px;padding-right:28px}.ins p{font-size:14px}
.ins-a{margin-top:8px;font-weight:700;color:#45307F}
.ba{display:flex;flex-direction:column}
.ba-row{display:grid;grid-template-columns:1.1fr 1fr 28px 1fr;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.ba-row:last-child{border-bottom:none}
.ba-k{font-weight:600}.ba-b{color:#8E1E26;text-decoration:line-through;text-decoration-color:rgba(194,49,59,.4)}.ba-a{color:var(--green-deep);font-weight:700}
.ba-arrow{height:2px;background:var(--marigold);position:relative}.ba-arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--marigold)}
.minibar{height:6px;background:var(--paper);border-radius:3px;overflow:hidden;margin-bottom:3px}.minibar div{height:100%;background:var(--green)}
@media (max-width:1100px){.grid3,.insights{grid-template-columns:1fr}}
@media (max-width:900px){.intro-hero,.pains,.roles-grid{grid-template-columns:1fr}.pains > div{border-right:none;border-bottom:1px solid var(--line)}.ba-row{grid-template-columns:1fr;gap:4px}.ba-arrow{display:none}
  .story{right:12px;left:12px;bottom:12px;width:auto}}

/* persona selection */
.intro-hero{padding-bottom:150px}
.ih-live{grid-template-columns:repeat(4,1fr)}
.persona-sec{padding:0 clamp(20px,6vw,90px);margin-top:-84px;position:relative;z-index:2}
.ps-head{background:#fff;border:1px solid var(--line);border-radius:20px 20px 0 0;border-bottom:none;padding:22px 26px 6px;box-shadow:var(--shadow)}
.ps-head h2{font-size:26px;letter-spacing:-.02em}
.ps-head p{color:var(--muted);margin-top:4px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 20px 20px;padding:18px 26px 26px;box-shadow:var(--shadow)}
.pcard{border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:transform .18s, box-shadow .18s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 26px 50px -24px rgba(27,24,70,.45)}
.pc-img{border:none;padding:0;margin:0;cursor:pointer;position:relative;display:block;background:none;line-height:0}
.portrait{width:100%;height:auto;display:block;transition:transform .4s}
.pcard:hover .portrait{transform:scale(1.04)}
.pc-img{overflow:hidden}
.pc-badge{position:absolute;left:12px;bottom:12px;background:rgba(15,18,48,.72);backdrop-filter:blur(6px);color:#fff;font:600 12px var(--body);padding:5px 10px;border-radius:20px;line-height:1.3}
.pc-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc-role{font-size:12.5px;font-weight:700;color:var(--muted)}
.pc-body h3{font-size:21px}
.pc-pain{font-family:var(--display);font-size:16px;line-height:1.35;color:var(--ink);border-left:3px solid var(--marigold);padding-left:10px;margin:4px 0}
.pc-gets{font-size:14px;color:var(--muted);flex:1}
.pc-acts{display:flex;gap:14px;align-items:center;margin-top:8px}
.pc-go{flex:1;padding:12px 14px}
.pc-rider .pc-go{background:linear-gradient(100deg,#FF8A3D,#E8579B);box-shadow:0 10px 22px -12px rgba(232,87,155,.9)}
.pc-hub .pc-go{background:linear-gradient(100deg,#5146E5,#9B5CF6)}
.pc-hq .pc-go{background:linear-gradient(100deg,#0E9F6E,#14B8A6);box-shadow:0 10px 22px -12px rgba(14,159,110,.9)}
.fullday{display:flex;align-items:center;gap:20px;margin-top:18px;background:linear-gradient(100deg,#fff,#F6F3FF);border:1px solid var(--line);border-radius:18px;padding:16px 22px;flex-wrap:wrap}
.fd-dots{display:flex;gap:4px}
.fd-dots span{width:10px;height:24px;border-radius:4px;background:#C5C8D9}
.fd-dots .fd-rider{background:#FF8A3D}.fd-dots .fd-hub{background:#7C5CFF}.fd-dots .fd-hq{background:#14B8A6}
.fd-text{flex:1;min-width:220px}
.story-title{display:flex;gap:10px;align-items:center}
.story-av{width:46px;height:46px;border-radius:14px;overflow:hidden;flex:0 0 46px;line-height:0}
.story-av{min-width:46px;position:relative}
.story-av .portrait{position:absolute;top:0;left:-4px;width:54px!important;height:46px!important;max-width:none;transform:none!important}
@media (max-width:1000px){.pcards{grid-template-columns:1fr}.ih-live{grid-template-columns:1fr 1fr}}

/* compact landing */
.intro-c .hero-c{position:relative;overflow:hidden;background:radial-gradient(700px 300px at 80% 0%, rgba(155,92,246,.35), transparent 60%), linear-gradient(110deg,var(--night) 0%,#1E1650 55%,#3A1C5E 100%);color:#fff;padding:26px clamp(20px,5vw,72px) 30px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.hc-sky{position:absolute;right:0;bottom:0;width:60%;height:100%;pointer-events:none}
.hc-text{flex:1;min-width:320px;position:relative}
.hc-text h1{font-size:clamp(22px,2.15vw,31px);letter-spacing:-.02em;line-height:1.15;max-width:34ch;background:linear-gradient(100deg,#fff 40%,#FFD3B0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hc-text p{color:#C9C6EA;font-size:15px;margin-top:8px;max-width:62ch}
.hc-stats{display:flex;gap:10px;position:relative}
.hc-stats div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px;min-width:120px}
.hc-stats b{display:block;font:800 20px var(--display);color:#fff;white-space:nowrap}.hc-stats span{font-size:12px;color:#C9C6EA}
.persona-c{padding:22px clamp(20px,5vw,72px) 10px}
.pc-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.pc-head h2{font-size:22px;letter-spacing:-.02em}.pc-head p{color:var(--muted);font-size:14px;margin-top:2px}
.fullday-btn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow);text-align:left;font:inherit}
.fullday-btn:hover{border-color:var(--green)}
.fullday-btn b{display:block;font-size:14px;color:var(--green)}.fullday-btn small{font-size:12px;color:var(--muted)}
.fullday-btn .fd-dots span{width:6px;height:18px}
.pcards-c{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.intro-c .pc-img{height:clamp(140px,25vh,210px);overflow:hidden}
.intro-c .portrait{height:auto!important;width:100%;margin-top:-13%}
.intro-c .pc-body{padding:12px 16px 14px;gap:4px}
.pc-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pc-name h3{font-size:18px}.intro-c .pc-role{font-size:12px}
.intro-c .pc-pain{font-size:14.5px;margin:6px 0 4px}
.intro-c .pc-acts{margin-top:6px}.intro-c .pc-go{padding:10px 12px}
.intro-c .intro-band{padding-top:30px}
@media (max-width:1000px){.pcards-c{grid-template-columns:1fr}.hc-stats{flex-wrap:wrap}}

.autoload-chip{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700;color:#05603F;background:linear-gradient(100deg,#DCF5EA,#EAFBF4);border-radius:10px;padding:6px 10px}

.upi-wait{display:flex;gap:10px;align-items:flex-start}.upi-wait .spinner{margin-top:3px;border-color:rgba(5,96,63,.2);border-top-color:#05603F}

.linked{display:flex;gap:10px;align-items:flex-start;background:#EEF4FF;border:1px solid #D6E2FF;border-radius:12px;padding:10px 12px;font-size:13px;color:#24408E}
.linked-chip{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700;color:#24408E;background:#EEF4FF;border-radius:10px;padding:6px 10px}

/* consolidated consoles */
.modebar{margin-bottom:16px}
.subsection{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.sub-h{font-size:24px;letter-spacing:-.02em}
.empty-inline{color:var(--muted);font-size:14px;padding:6px 0}
details.decided{margin-top:12px;border-top:1px solid #F0F1F7;padding-top:10px}
details.decided summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--green);list-style:none}
details.decided summary::-webkit-details-marker{display:none}
details.decided summary::before{content:"▸ ";color:var(--muted)}
details.decided[open] summary::before{content:"▾ "}
details.decided table{margin-top:8px}
.ask-fab{position:fixed;left:18px;bottom:18px;z-index:35;border:none;border-radius:24px;padding:12px 18px;font:700 14px var(--body);color:#fff;cursor:pointer;background:linear-gradient(100deg,var(--ai1),var(--ai2));box-shadow:0 12px 28px -12px rgba(232,87,155,.9)}
.ask-fab[aria-expanded=true]{background:var(--night)}
.ask-drawer{position:fixed;top:60px;right:0;bottom:0;width:min(460px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-24px 0 50px -30px rgba(15,18,48,.5);z-index:34;display:flex;flex-direction:column;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.ad-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid #F0F1F7}
.ad-head h2{font-size:18px;background:linear-gradient(100deg,var(--ai1),var(--ai2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ad-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px 8px}
.ask-drawer .chatpanel{flex:1;display:flex;flex-direction:column;border:none;box-shadow:none;border-radius:0;margin:0;min-height:0}
.ask-drawer .chatlog{flex:1;max-height:none}
.ask-drawer .msg{max-width:92%}
body.ask-open .cmain{padding-right:490px}
body.ask-open .story{right:auto;left:240px}
@media (max-width:1000px){body.ask-open .cmain{padding-right:30px}.ask-fab{left:auto;right:18px}}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;animation:tin .25s ease;max-width:90vw}
.toast.bad{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:900px){
  .console{grid-template-columns:1fr}
  .cside{flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line)}
  .cside .ctx{width:100%}
  .grid2{grid-template-columns:1fr}
  .demo-panel{display:none}
  .cmain{padding:20px 16px 50px}
}
@media (max-width:480px){
  .rider-stage{padding:0}
  .phone{width:100%;height:auto;min-height:calc(100vh - 110px);border:none;border-radius:0;box-shadow:none;overflow:visible}
  .app-scroll{overflow:visible}
  .tabbar{position:sticky;bottom:0}
  .lg{display:none}.sm-l{display:inline}
  .topbar{gap:10px;padding:10px 12px}
  .phone .notch{display:none}
  .app-scroll{padding-top:16px}
}
/* ===================== Theme v2: Mumbai dusk ===================== */
:root{
  --ink:#14152B; --muted:#646882; --paper:#F4F5FA; --white:#FFFFFF;
  --green:#5146E5; --green-deep:#1B1846; --green-soft:#ECEBFD;
  --marigold:#FF8A3D; --marigold-soft:#FFEEDF;
  --red:#E5484D; --red-soft:#FDECEC; --line:#E4E6F0;
  --ok:#0E9F6E; --ok-soft:#DCF5EA; --ok-ink:#05603F;
  --ai1:#7C5CFF; --ai2:#E8579B;
  --night:#0F1230; --plum:#2A1650;
  --shadow:0 1px 2px rgba(20,21,43,.04), 0 10px 30px -14px rgba(20,21,43,.14);
  --display:'Bricolage Grotesque','Segoe UI',sans-serif; --body:'Public Sans','Segoe UI',sans-serif;
}
body{background:radial-gradient(1200px 500px at 100% -10%, #ECEBFD 0, transparent 60%), var(--paper)}
.topbar{background:linear-gradient(100deg,var(--night) 0%,#1F1748 55%,var(--plum) 100%);padding:12px 22px;box-shadow:0 8px 24px -16px rgba(15,18,48,.8);position:sticky;top:0;z-index:30}
.logo i{background:linear-gradient(135deg,var(--marigold),#FFB36B);border-radius:8px}
.logo i::after{background:var(--night)}
.roles{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px}
.roles button{border-radius:9px;color:#C9C6EA}
.roles button[aria-pressed=true]{background:#fff;color:var(--night);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.topbar select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);border-radius:9px}
.btn{border-radius:10px;background:var(--green);box-shadow:0 6px 16px -8px rgba(81,70,229,.7);transition:transform .12s, box-shadow .12s, background .12s}
.btn:hover{background:#4338CA;transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid #D9D6FB;box-shadow:none}
.btn.ghost:hover{background:var(--green-soft)}
.btn.danger{box-shadow:none;border-color:#F4C3C5}
.btn:disabled{background:#C8CADB;border-color:#C8CADB;box-shadow:none;transform:none}
.aibtn,.btn.aibtn{background:linear-gradient(100deg,var(--ai1),var(--ai2));box-shadow:0 8px 20px -10px rgba(232,87,155,.8)}
.aibtn:hover{background:linear-gradient(100deg,#6B4AF0,#D9468B)}
.story-btn{background:linear-gradient(100deg,var(--marigold),#FFB36B)!important;color:var(--night)!important}
.input{border-radius:10px;border-color:var(--line)}
.input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(81,70,229,.12)}
.pill{border-radius:20px;padding:3px 10px}
.p-ok{background:var(--ok-soft);color:var(--ok-ink)}
.p-warn{background:#FFF3E0;color:#9A4A00}
.p-bad{background:var(--red-soft);color:#A3222A}
.p-neutral{background:#EEEFF6;color:var(--muted)}
.n-ok{background:var(--ok-soft);color:var(--ok-ink)} .n-warn{background:#FFF3E0;color:#7A3D00} .n-bad{background:var(--red-soft);color:#A3222A}
.note{border-radius:12px}
.badge{background:linear-gradient(135deg,var(--red),#FF6B6F);border-radius:10px}
/* consoles */
.cside{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.cside .ctx b{font-size:18px}
.cside button{border-radius:10px;gap:10px;justify-content:flex-start;color:#555A75}
.cside button .lbl{flex:1}
.cside button[aria-current=page]{background:linear-gradient(100deg,#ECEBFD,#F6F0FF);color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.ico{width:18px;height:18px;flex:0 0 18px}
.cmain{padding:30px 34px 70px}
.chead h1{font-size:30px;letter-spacing:-.02em}
.panel{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);background:#fff}
.panel > .ph{border-bottom:1px solid #F0F1F7;padding:16px 20px}
.panel > .ph h2{font-size:17px}
.kpis{gap:14px;background:none;border:none;overflow:visible}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);border-right:1px solid var(--line)!important;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--green),var(--ai1))}
.kpi.alert::before{background:linear-gradient(var(--red),#FF8A8D)}
.kpi.alert b{color:var(--red)}
th{background:#F8F8FC;color:#7A7E98}
tr:hover td{background:#FBFBFE}
.req{border:1px solid #FFD8B8;background:linear-gradient(100deg,#FFF8F1,#fff);border-radius:14px}
.copilot,.aibox{background:linear-gradient(100deg,#F5F1FF,#FFF3F8);border:1px solid #E7DDFD;border-radius:12px}
.conf span{background:linear-gradient(90deg,var(--ai1),var(--ai2))}
.xc{border-radius:16px;box-shadow:var(--shadow);border-left-width:5px}
.xc.s-resolved{border-left-color:var(--ok)}
.flags li{border-radius:20px}
.solves{background:linear-gradient(100deg,#ECEBFD,#F7F3FF);color:var(--green-deep);border-radius:20px;padding:5px 12px 5px 5px}
.solves span{background:var(--green);border-radius:14px}
.seg{border-radius:10px;border-color:var(--line)}
.seg button[aria-pressed=true]{background:var(--green)}
.chip{border-color:#E1D9FC;color:#5B3FD0;border-radius:20px}
.msg.me{background:linear-gradient(100deg,var(--green),#6B5CF0)}
.msg.ai{background:linear-gradient(100deg,#F5F1FF,#FFF5FA);border-color:#E7DDFD}
.toast{background:var(--night);border-radius:12px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
/* rider phone */
.rider-stage{padding:34px 20px 40px}
.phone{border:11px solid #0E0F1A;border-radius:48px;background:#F7F7FC;box-shadow:0 40px 80px -30px rgba(27,24,70,.55), 0 0 0 1px #2A2B3D inset}
.statusbar{display:flex;justify-content:space-between;padding:10px 26px 0;font-size:12px;font-weight:700;color:var(--ink);height:30px}
.app-scroll{padding:8px 18px 18px}
.app-scroll > *{flex-shrink:0}
.who-wrap{display:flex;gap:10px;align-items:center}
.avatar-sm{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--marigold),#FFB36B);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.avatar-xs{width:22px;height:22px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-grid;place-items:center;font-weight:800;font-size:10px;margin-right:6px}

const tokens = s => new Set(String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w && !STOP.has(w)));
const norm = s => [...tokens(s)].sort().join(' ');
function nameSim(a,b){ const A=tokens(a), B=tokens(b); if(!A.size||!B.size) return 0; let i=0; A.forEach(x=>{ if(B.has(x)) i++; }); return i/new Set([...A,...B]).size; }
function cashCollected(rid){ return st.txns.filter(t=>t.type==='cod_cash' && t.rider===rid).reduce((a,t)=>a+t.amount,0); }
function cashDeclared(rid){ return (st.deposits||[]).filter(d=>d.rider===rid).reduce((a,d)=>a+d.declared,0); }
function cashHeld(r){ return cashCollected(r.id) - cashDeclared(r.id); }
function cashOldestMins(r){
  if(cashHeld(r)<=0) return 0; let dec = cashDeclared(r.id);
  for(const c of st.txns.filter(t=>t.type==='cod_cash' && t.rider===r.id).sort((a,b)=>a.at.localeCompare(b.at))){
    if(dec >= c.amount){ dec -= c.amount; continue; } return Math.round((Date.now()-new Date(c.at))/60000);
  } return 0;
}
const fmtAge = m => m<60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`;
function hubCash(hid){

  const banked = st.banked.filter(b=>b.hub===hid).reduce((a,b)=>a+b.amount,0);
  return {collected: st.txns.filter(t=>t.type==='cod_cash' && t.hub===hid).reduce((a,t)=>a+t.amount,0),
    withRiders: st.riders.filter(r=>r.hub===hid).reduce((a,r)=>a+Math.max(0,cashHeld(r)),0),
    transit: ds.filter(d=>d.status==='pending').reduce((a,d)=>a+d.declared,0),
    declared: ds.reduce((a,d)=>a+d.declared,0), counted,
    short: ds.filter(d=>d.status==='confirmed').reduce((a,d)=>a+(d.declared-d.counted),0),

}
function codCollected(oid){

function riderLedger(r){

  const L = {alloc:sum('allocate'), topup:sum('topup'), spent:sum('payment'), returned:sum('sweep')};
  L.expected = L.alloc + L.topup - L.spent - L.returned; L.actual = r.balance; L.diff = L.actual - L.expected; return L;
}
function hubLedger(h){
  const tx = st.txns.filter(t=>t.hub===h.id); const sum = ty => tx.filter(t=>t.type===ty).reduce((a,t)=>a+t.amount,0);
  const L = {funded:sum('fund_hub'), allocated:sum('allocate'), topups:sum('topup'), cod:sum('cod'), returned:sum('sweep')};
  L.expected = L.funded + L.cod + L.returned - L.allocated - L.topups; L.actual = h.balance; L.diff = L.actual - L.expected; return L;
}
function paymentFlags(t){
  const o = order(t.order), R = st.rules, f = [];
  if(!o) return ['Order not found'];
  if(o.billAmt==null){ if(o.noBill){ if(t.amount > R.noBillMax) f.push(`No bill for a ${inr(t.amount)} payment, above the ${inr(R.noBillMax)} no-bill limit`); } else f.push('Bill not uploaded'); }
  else {
    const d = t.amount - o.billAmt;
    if(Math.abs(d) > R.matchWithin) f.push(`Paid ${inr(Math.abs(d))} ${d>0?'more':'less'} than bill`);
    if(o.billAI && o.billAI.engine==='claude'){
      if(o.billAI.legible===false || o.billAI.total==null) f.push('AI could not read the bill photo');
      else if(Math.abs(o.billAI.total - o.billAmt) > R.matchWithin) f.push(`Bill photo shows ${inr(o.billAI.total)}, rider entered ${inr(o.billAmt)}`);
    }
  }
  const over = (t.amount - o.estimate)/o.estimate*100;
  if(over > R.tolerancePct) f.push(`${Math.round(over)}% over order estimate`);
  if(t.payee && norm(t.payee) !== norm(o.store)) f.push(`Paid to "${t.payee}", order store is ${o.store}`);

}

async function callClaude(content, system){
  const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 60000);
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'Content-Type':'application/json'}, signal:ctrl.signal,
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, system, messages:[{role:'user', content}]})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.type==='text'?b.text:'').join('');
    return JSON.parse(text.replace(/```json|```/g,'').trim());
  } finally { clearTimeout(tm); }
}
async function readBill(o){
  if(!o.billImg) return {engine:'unavailable'};
  try{
    const b64 = o.billImg.split(',')[1];
    const r = await callClaude([
      {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
      {type:'text', text:`This should be a shop bill for order ${o.id}, bought at "${o.store}". Read it and return only this JSON object: {"legible": true or false, "store": string or null, "total": number or null, "date": string or null, "confidence": 0-100, "note": "max 15 words"}. "total" is the final amount payable in rupees, as a plain number. If the image is not a bill or the total can't be read, set legible to false and total to null.`}
    ], 'You read photos of Indian shop bills and receipts. Respond with only a JSON object and no other text.');
    return {engine:'claude', legible:!!r.legible, store:r.store||null, total: typeof r.total==='number' ? Math.round(r.total) : (r.total? num(r.total) : null), confidence: Math.max(0,Math.min(100,num(r.confidence))), note:r.note||''};
  }catch(e){ return {engine:'unavailable', error:String(e.message||e)}; }
}

/* ================= Risk signals (used by co-pilot and anomaly detection) ================= */
function riderRiskSignals(r){
  const S = []; const R = st.rules;
  // top-ups beyond what orders needed
  const byOrder = {};
  st.requests.filter(q=>q.rider===r.id && q.status==='approved' && !q.auto).forEach(q=>{ (byOrder[q.order] = byOrder[q.order] || []).push(q); });
  Object.entries(byOrder).forEach(([oid, qs])=>{
    const o = order(oid); const total = qs.reduce((a,q)=>a+q.amount,0);
    const auto = qs.filter(q=>q.by==='Auto-approved');
    if(auto.length>=2 && auto.reduce((a,q)=>a+q.amount,0) > R.autoLimit) S.push({type:'split', pts:30, text:`${auto.length} auto-approved top-ups for ${oid}, each under the ${inr(R.autoLimit)} limit, totalling ${inr(auto.reduce((a,q)=>a+q.amount,0))}`});
    if(o && total > o.estimate) S.push({type:'excess', pts:25, text:`Top-ups for ${oid} (${inr(total)}) exceed the order estimate of ${inr(o.estimate)}`});
  });
  // payments to unrelated merchants
  st.txns.filter(t=>t.type==='payment' && t.rider===r.id).forEach(t=>{
    const o = order(t.order); if(o && t.payee && norm(t.payee)!==norm(o.store) && nameSim(t.payee,o.store) < 0.3)
      S.push({type:'payee', pts:20, text:`Paid "${t.payee}" for ${t.order}, but the order store is ${o.store}`});
  });
  // paid more than bill
  const over = st.txns.filter(t=>t.type==='payment' && t.rider===r.id).filter(t=>{ const o=order(t.order); return o && o.billAmt!=null && t.amount - o.billAmt > R.matchWithin; });
  if(over.length) S.push({type:'overbill', pts:over.length>1?20:10, text:`${over.length} payment${over.length>1?'s':''} higher than the bill (${over.map(t=>t.order).join(', ')})`});
  // payments without bills, unusually often
  const pays_ = st.txns.filter(x=>x.type==='payment' && x.rider===r.id); const nb = pays_.filter(x=>order(x.order)?.noBill);
  if(nb.length>=3 && nb.length/pays_.length>0.5) S.push({type:'nobillfreq', pts:15, text:`${nb.length} of ${pays_.length} store payments made without a bill`});
  // missing bills
  const miss = st.orders.filter(o=>o.rider===r.id && o.status==='paid' && o.paidAt && (Date.now()-new Date(o.paidAt))>15*60000);
  if(miss.length) S.push({type:'nobill', pts:10, text:`${miss.length} bill${miss.length>1?'s':''} not uploaded within 15 minutes`});
  // cash handling
  const held = cashHeld(r), age = cashOldestMins(r);
  if(held > st.rules.cashLimit) S.push({type:'cashlimit', pts:20, text:`Holding ${inr(held)} cash, over the ${inr(st.rules.cashLimit)} limit`});
  if(held>0 && age > st.rules.cashAgeHours*60) S.push({type:'cashage', pts:15, text:`Cash held for ${fmtAge(age)} without handing it in`});
  st.deposits.filter(d=>d.rider===r.id && d.status==='confirmed' && d.declared - d.counted > st.rules.matchWithin).forEach(d=>S.push({type:'cashshort', pts:20, text:`Cash deposit ${d.code} counted ${inr(d.declared-d.counted)} short`}));
  // COD shortfalls
  st.orders.filter(o=>o.rider===r.id && o.cod && o.status==='delivered').forEach(o=>{ const c = codCollected(o.id); if(c < o.codAmount) S.push({type:'cod', pts:15, text:`COD for ${o.id} short by ${inr(o.codAmount-c)}`}); });
  return S;
}
function requestRisk(q){
  const r = rider(q.rider), o = order(q.order), R = st.rules; const S = [];
  const need = (()=>{ if(!o) return q.amount; const list = st.orders.filter(x=>x.rider===r.id && x.status==='assigned'); const idx = list.findIndex(x=>x.id===o.id); if(idx<0) return Math.max(0, o.estimate - r.balance);
    const committed = list.slice(0, idx+1).reduce((a,x)=>a+x.estimate,0); const earlier = new Set(list.slice(0, idx).map(x=>x.id));
    const earlierPending = st.requests.filter(x=>x.id!==q.id && x.status==='pending' && earlier.has(x.order)).reduce((a,x)=>a+x.amount,0);
    const later = new Set(list.slice(idx+1).map(x=>x.id));
    const reservedForLater = st.requests.filter(x=>x.status==='approved' && later.has(x.order)).reduce((a,x)=>a+x.amount,0);
    return Math.max(0, Math.ceil((committed*(1+st.rules.autoLoadBuffer/100) - (r.balance - reservedForLater) - earlierPending)/50)*50); })();
  if(o && need===0) S.push({pts:40, text:`Balance of ${inr(r.balance)} already covers this ${inr(o.estimate)} order`});
  else if(q.amount > need*1.2 + 50) S.push({pts:20, text:`Asks ${inr(q.amount)}; the order only needs ${inr(need)} more`});
  const prior = st.requests.filter(x=>x.rider===r.id && x.order===q.order && x.status==='approved' && !x.auto);
  if(prior.length) S.push({pts:25, text:`Already received ${inr(prior.reduce((a,x)=>a+x.amount,0))} in ${prior.length} top-up${prior.length>1?'s':''} for this order`});
  riderRiskSignals(r).filter(s=>s.type!=='excess' || !s.text.includes(q.order)).forEach(s=>S.push({pts:Math.round(s.pts/2), text:s.text}));
  if(r.autoFrozen) S.push({pts:10, text:'Auto-approvals are paused for this rider'});
  const score = Math.min(100, S.reduce((a,s)=>a+s.pts,0));
  const level = score<30?'low':score<60?'medium':'high';
  const rec = level==='low' ? {recommendation:'approve', amount:q.amount} : level==='medium' && need>0 ? {recommendation:'approve_partial', amount:Math.min(q.amount, Math.ceil(need/10)*10)} : {recommendation:'decline', amount:0};
  return {score, level, signals:S, need, ...rec};
}

const COPILOT_SYSTEM = `You are an approval co-pilot for hub managers at Quick Deliver, a grocery delivery company in Mumbai. Riders request wallet top-ups to pay stores for customer orders. Weigh the request against the order's real need and the rider's history today. Be fair: most requests are legitimate, and a rider who is genuinely short should be funded quickly.
Return ONLY a JSON object: {"recommendation": "approve" | "approve_partial" | "decline", "amount": number (rupees to approve; 0 for decline), "risk": "low" | "medium" | "high", "score": 0-100, "reason": "max 35 words for the manager, citing the specific evidence", "decline_message": "max 25 words, polite, for the rider, or null"}`;
async function runCopilot(q){
  if(q.aiState==='busy') return; q.aiState='busy';
  const r = rider(q.rider), o = order(q.order), base = requestRisk(q);
  const ctx = {request:{amount:q.amount, order:q.order, requested_at:tfmt(q.at)}, order:o?{estimate:o.estimate, store:o.store, cod:o.cod}:null,
    rider:{name:r.name, balance:r.balance, topups_today:r.topupToday, daily_limit:st.rules.dailyCap, auto_approve_limit:st.rules.autoLimit, auto_approvals_paused:!!r.autoFrozen},
    shortfall_for_order:base.need, earlier_requests_today: st.requests.filter(x=>x.rider===r.id && x.id!==q.id).map(x=>({amount:x.amount, order:x.order, status:x.status, by:x.by||null, at:tfmt(x.at)})),
    risk_signals: base.signals.map(s=>s.text), rules_score: base.score};
  try{
    const res = parseJSON(await callClaudeText([{role:'user', content:JSON.stringify(ctx)}], COPILOT_SYSTEM));
    q.ai = {engine:'Claude', recommendation:['approve','approve_partial','decline'].includes(res.recommendation)?res.recommendation:base.recommendation,
      amount: Math.max(0, Math.min(q.amount, num(res.amount))), risk:['low','medium','high'].includes(res.risk)?res.risk:base.level,
      score: Math.max(0,Math.min(100,num(res.score))), reason:String(res.reason||'').slice(0,300), decline_message:res.decline_message?String(res.decline_message).slice(0,200):null};
  }catch(e){
    q.ai = {engine:'Rules fallback', recommendation:base.recommendation, amount:base.amount, risk:base.level, score:base.score,
      reason: base.signals.length ? base.signals.slice(0,2).map(s=>s.text).join('. ')+'.' : `Short by ${inr(base.need)} for this order with a clean record today.`,
      decline_message: base.recommendation==='decline' ? 'Your balance already covers this order. Call your hub if the bill is higher than expected.' : null};
  }
  if(q.ai.recommendation==='approve_partial' && !q.ai.amount) q.ai.amount = base.amount || q.amount;
  q.aiState='done'; commit();
}

      requests_today: st.requests.filter(q=>q.rider===r.id).map(q=>({order:q.order, amount:q.amount, status:q.status, by:q.by||null, at:tfmt(q.at)})),
      payments_today: st.txns.filter(t=>t.type==='payment'&&t.rider===r.id).map(t=>({order:t.order, paid:t.amount, payee:t.payee, estimate:order(t.order)?.estimate, bill:order(t.order)?.billAmt}))}));
    if(!payload.length) throw new Error('nothing');
    const res = parseJSON(await callClaudeText([{role:'user', content:JSON.stringify({rules:st.rules, riders:payload})}], RISK_SYSTEM));
    if(!Array.isArray(res)) throw new Error('bad');
    cases = res.map(c=>({rider:(st.riders.find(r=>r.name===c.rider)||{}).id, severity:['high','medium','low'].includes(c.severity)?c.severity:'medium', title:String(c.title||'Pattern detected').slice(0,80), pattern:String(c.pattern||'').slice(0,300), evidence:(Array.isArray(c.evidence)?c.evidence:[]).slice(0,5).map(x=>String(x).slice(0,160)), action:String(c.action||'').slice(0,160), pause:!!c.pause_auto_approvals})).filter(c=>c.rider);
    engine = 'Claude';
  }catch(e){
    cases = riders.map(({r,s})=>{ const pts = s.reduce((a,x)=>a+x.pts,0); const sev = pts>=50?'high':pts>=25?'medium':'low';
      const top = s.slice().sort((a,b)=>b.pts-a.pts)[0];
      const titles = {nobillfreq:'Often pays without bills', cashlimit:'Too much cash in hand', cashage:'Cash held too long', cashshort:'Short cash deposit', split:'Top-ups split under the limit', excess:'Top-ups beyond order needs', payee:'Payment to an unrelated merchant', overbill:'Paying more than the bill', nobill:'Bills not uploaded', cod:'COD collections short'};
      return {rider:r.id, severity:sev, title:titles[top.type]||'Pattern detected', pattern:`${s.length} signal${s.length>1?'s':''} today with a combined score of ${pts}.`, evidence:s.map(x=>x.text), action: sev==='high'?'Pause auto-approvals and call the rider today.':sev==='medium'?'Review on the next shift handover.':'Monitor.', pause: sev==='high'}; });
    engine = riders.length ? 'Rules fallback' : 'Rules';
  }
  const order_ = {high:0, medium:1, low:2};
  st.riskRun = {engine, at:new Date().toISOString(), cases: cases.sort((a,b)=>order_[a.severity]-order_[b.severity]).map((c,i)=>({...c, id:'K'+i, status:'open'}))};
  audit(engine==='Claude'?'AI risk review':'Rules risk review', `Reviewed ${riders.length} riders with signals; ${cases.length} case${cases.length===1?'':'s'} raised`);
  ui.riskBusy = false; commit();
}

const AI_SYSTEM = `You are the reconciliation analyst for Quick Deliver, a hyperlocal grocery delivery company in Mumbai. Riders pay local stores by UPI from a company wallet, upload the bill, and collect cash-on-delivery (COD) from customers by UPI. A rules engine has flagged exceptions; you decide what each one most likely means.

Return ONLY a JSON array, no prose, one object per input item:
[{"id": string, "verdict": "ok" | "likely_ok" | "mismatch", "confidence": 0-100, "explanation": "max 25 words for the hub manager", "action": "accept" | "ask_rider" | "recover" | "link" | "reversal", "link_to": order id or null, "rider_message": "max 30 words, polite and specific, or null"}]

Guidance:
- UPI payee names are often legal or abbreviated versions of the shop name (e.g. "SRI SAI KIRANA & GENERAL" = "Sai Kirana Stores"). Treat clear variants as the same merchant (likely_ok, accept). An unrelated business (e.g. a mobile recharge shop paid for a grocery order) is a mismatch: ask_rider.
- A missing bill: ask_rider. Many kirana stores issue no bill: if bill_status says the store issues no bill and the payment is linked to the order by UPI reference, the order link is the proof of purchase. Accept when the amount is within the estimate and the payee matches the store; ask_rider when it is above the no-bill limit or over the estimate. A bill photo the AI could not read: ask_rider for a clearer photo.
- Rider-entered bill differs from the paid amount or the AI-read bill total: if the gap is small (up to ₹20) and otherwise consistent, likely_ok/accept; larger gaps: ask_rider, or recover if the rider has already replied without a credible reason.
- Bill much higher than the estimate but bill and payment agree: usually customer added items; likely_ok, but ask_rider if over 40%.
- An unlinked UPI credit whose amount equals a COD shortfall, or whose payer note references that order number: action "link" with link_to set to that order id. If no plausible order: accept (move to suspense) with low confidence.
- COD shortfall: if a matching unlinked credit exists, explain that and set action "link" on the credit item, and "accept" on the COD item with explanation that linking resolves it. Otherwise ask_rider.
- Wallet statement differences where the wallet is lower than the ledger usually mean a failed UPI debit awaiting reversal: action "reversal", rider_message null.
- Cash in hand (type cashheld): riders collect COD in cash and must hand it in. Over the cash limit or held for hours: ask_rider with a firm, polite message to deposit now. Small amounts collected recently: likely_ok, accept (carry over).
- Cash deposit short (type cashshort): small gaps (up to ₹20) are usually counting or change errors: likely_ok, accept. Larger gaps: ask_rider; recover if the rider already replied without a credible reason.
- Consider rider_reply when present: a credible explanation supports accept; an evasive one supports recover.
- rider_message is required for ask_rider and recover, otherwise null. Never accuse; state the facts and what to do.`;
function aiPayload(items){
  return items.filter(i=>i.status!=='resolved' && i.kind!=='cashpending').slice(0,14).map(i=>({
    id:i.key, type:i.kind, rider:i.rider?rider(i.rider).name:null, rule_flags:i.flags, ...i.data,
    rider_reply: i.rec.riderReply ? (i.rec.riderReply.translation ? i.rec.riderReply.translation+' (translated)' : i.rec.riderReply.text) + (i.rec.riderReply.newBill?' (uploaded a new bill photo)':'') : null,
    rider_open_exceptions_today: i.rider ? items.filter(x=>x.rider===i.rider && x.status!=='resolved').length : 0
  }));
}
function aiFallback(items){
  const shorts = items.filter(i=>i.kind==='cod');
  return items.filter(i=>i.status!=='resolved').map(i=>{
    const o = i.order ? order(i.order) : null; const r = {id:i.key, link_to:null, rider_message:null};
    if(i.kind==='credit'){
      const digits = (i.data.payer_note||'').match(/\d{4,6}/);
      const hit = shorts.find(s=> (digits && s.order.endsWith(digits[0])) || s.data.shortfall===i.data.credit_amount);
      return hit ? {...r, verdict:'likely_ok', confidence:(digits && hit.data.shortfall===i.data.credit_amount)?92:digits?80:65, action:'link', link_to:hit.order, explanation:`Amount or payer note matches the COD shortfall on ${hit.order}.`}
                 : {...r, verdict:'mismatch', confidence:40, action:'accept', explanation:'No matching order found. Move to suspense until the customer is identified.'};
    }
    if(i.kind==='cashheld'){
      const urgent = i.data.cash_still_held > i.data.cash_limit || i.data.oldest_held_minutes > st.rules.cashAgeHours*60;
      return urgent ? {...r, verdict:'mismatch', confidence:80, action:'ask_rider', explanation:`${inr(i.data.cash_still_held)} held${i.data.cash_still_held>i.data.cash_limit?', over the cash limit':''}${i.data.oldest_held_minutes>st.rules.cashAgeHours*60?', for '+fmtAge(i.data.oldest_held_minutes):''}. Ask for an immediate deposit.`, rider_message:riderMessageFor(i)}
                    : {...r, verdict:'likely_ok', confidence:70, action:'accept', explanation:'Recent, small amount. Carry over to tomorrow if not handed in.'};
    }
    if(i.kind==='cashshort'){
      const gap = Math.abs(i.data.difference);
      if(gap<=20) return {...r, verdict:'likely_ok', confidence:75, action:'accept', explanation:`Small ${inr(gap)} counting difference.`};
      if(i.rec.riderReply && gap>200) return {...r, verdict:'mismatch', confidence:60, action:'recover', explanation:`Rider replied but ${inr(gap)} is still missing.`, rider_message:`A recovery of ${inr(gap)} was raised for your cash deposit. Talk to your hub manager if this is wrong.`};
      return {...r, verdict:'mismatch', confidence:70, action:'ask_rider', explanation:`Deposit counted ${inr(gap)} short of what the rider declared.`, rider_message:riderMessageFor(i)};
    }
    if(i.kind==='statement') return {...r, verdict:'mismatch', confidence:60, action:'reversal', explanation:'Wallet is lower than the ledger, likely a failed UPI debit awaiting reversal.'};
    if(i.kind==='cod'){
      const cr = items.find(x=>x.kind==='credit' && x.status!=='resolved' && (x.data.credit_amount===i.data.shortfall || (x.data.payer_note||'').includes(i.order.slice(-5))));
      return cr ? {...r, verdict:'likely_ok', confidence:70, action:'accept', explanation:`An unlinked UPI credit matches this shortfall. Link the credit to resolve it.`}
                : {...r, verdict:'mismatch', confidence:60, action:'ask_rider', explanation:'Collection is short with no matching credit.', rider_message:riderMessageFor(i)};
    }
    const f = i.flags;
    const onlyPayee = f.length===1 && f[0].startsWith('Paid to');
    if(onlyPayee){
      const sim = nameSim(i.data.upi_payee_name, i.data.store);
      return sim>=0.5 ? {...r, verdict:'likely_ok', confidence:Math.round(60+sim*40), action:'accept', explanation:'Payee name looks like a variant of the store name.'}
                      : {...r, verdict:'mismatch', confidence:70, action:'ask_rider', explanation:'Payee does not resemble the order store.', rider_message:riderMessageFor(i)};
    }
    if(f.some(x=>x.startsWith('Bill not uploaded') || x.startsWith('AI could not') || x.startsWith('No bill for'))) return {...r, verdict:'mismatch', confidence:75, action:'ask_rider', explanation:'A readable bill is needed to match this payment.', rider_message:riderMessageFor(i)};
    const gap = o && o.billAmt!=null ? Math.abs(i.data.paid - o.billAmt) : 0;
    if(gap && gap<=20) return {...r, verdict:'likely_ok', confidence:65, action:'accept', explanation:`Small ${inr(gap)} difference, likely rounding.`};
    if(gap && gap<=200 && i.rec.riderReply) return {...r, verdict:'likely_ok', confidence:60, action:'accept', explanation:`Rider explained the ${inr(gap)} difference. Check the reply before accepting.`};
    if(gap > 200 && i.rec.riderReply) return {...r, verdict:'mismatch', confidence:60, action:'recover', explanation:`Rider replied but a ${inr(gap)} gap remains unexplained.`, rider_message:`A recovery of ${inr(gap)} was raised for ${i.order}. Talk to your hub manager if this is wrong.`};
    if(gap) return {...r, verdict:'mismatch', confidence:65, action:'ask_rider', explanation:`Paid ${inr(gap)} differently from the bill.`, rider_message:riderMessageFor(i)};
    return {...r, verdict:'likely_ok', confidence:55, action:'accept', explanation:'Bill and payment agree; higher than estimate is usually extra items.'};
  });
}
const ACTIONS = ['accept','ask_rider','recover','link','reversal'];
async function runAiMatching(hid){
  const items = hubExceptions(hid); const open = items.filter(i=>i.status!=='resolved');
  if(!open.length) return {count:0};
  let results, engine;
  try{
    const r = await callClaude([{type:'text', text: JSON.stringify({hub:hub(hid).name, rules:{match_within:st.rules.matchWithin, over_estimate_pct:st.rules.tolerancePct}, items:aiPayload(items)})}], AI_SYSTEM);
    if(!Array.isArray(r)) throw new Error('Unexpected response');
    results = r; engine = 'Claude';
  }catch(e){ results = aiFallback(items); engine = 'Rules fallback'; }
  const at = new Date().toISOString(); let alerted = 0;
  results.forEach(res=>{
    const i = open.find(x=>x.key===res.id); if(!i) return;
    const action = ACTIONS.includes(res.action) ? res.action : 'ask_rider';
    i.rec.ai = {verdict:['ok','likely_ok','mismatch'].includes(res.verdict)?res.verdict:'mismatch', confidence:Math.max(0,Math.min(100,num(res.confidence))),
      explanation:String(res.explanation||'').slice(0,240), action, link_to:res.link_to||null, rider_message:res.rider_message?String(res.rider_message).slice(0,280):null, engine, at};
    if(st.settings.autoAlert && i.rider && ['ask_rider','recover'].includes(action) && i.rec.ai.verdict==='mismatch' && !i.rec.alerted && !i.rec.riderReply){
      if(sendRiderAlert(i, i.rec.ai.rider_message || riderMessageFor(i))) alerted++;
    }
  });
  st.aiRuns[hid] = {engine, at, count:results.length, alerted};
  audit(engine==='Claude'?'AI matching':'Rules matching', `Reviewed ${results.length} exceptions at ${hub(hid).name}; ${alerted} rider alert${alerted===1?'':'s'} sent`);
  return {count:results.length, engine, alerted};
}
function applyAction(hid, key, action, by, extra={}){
  const i = hubExceptions(hid).find(x=>x.key===key); if(!i) return false;
  const rec = i.rec; const name = i.rider ? rider(i.rider).name : '';
  switch(action){
    case 'accept': rec.status='resolved'; rec.resolution = extra.note || 'Accepted'; break;
    case 'ask_rider':
      if(!i.rider){ toast('There is no rider to ask for this item.',true); return false; }
      sendRiderAlert(i, extra.msg || rec.ai?.rider_message || riderMessageFor(i)); toast(`Alert sent to ${name}`); break;
    case 'recover':
      rec.status='resolved'; rec.resolution='Recovery raised from rider';
      if(i.rider) st.notes.unshift({rider:i.rider, text: extra.msg || rec.ai?.rider_message || `A recovery was raised for ${i.order}. Talk to your hub manager if this is wrong.`, at:new Date().toISOString(), read:false, key:i.key, kind:'mismatch', order:i.order});
      break;
    case 'link': {
      const to = extra.to || rec.ai?.link_to; const o = to && order(to);
      if(!o || !o.cod || rider(o.rider).hub!==hid){ toast('Choose a COD order from this hub to link to.',true); return false; }
      const c = st.credits.find(x=>'CR:'+x.id===key); c.linked = o.id; rec.status='resolved'; rec.resolution=`Linked to ${o.id}`;
      const codRec = st.recon['COD:'+o.id];
      if(codRec && codRec.alerted) st.notes.unshift({rider:o.rider, text:`The missing payment for ${o.id} was found and matched. No action needed.`, at:new Date().toISOString(), read:false, key:'COD:'+o.id, kind:'info'});
      break;
    }
    case 'reversal': rec.status='resolved'; rec.resolution='Reversal raised with wallet issuer'; break;
    default: return false;
  }
  if(rec.status==='resolved'){ rec.by = by; rec.at = new Date().toISOString(); }
  audit(by, `${({accept:'Accepted',ask_rider:'Asked rider about',recover:'Raised recovery for',link:'Linked',reversal:'Raised reversal for'})[action]} ${i.title}`);
  return true;
}

function pendingFor(riderId){ return st.requests.filter(q=>q.rider===riderId && q.status==='pending').reduce((a,q)=>a+q.amount,0); }

function requestTopup(riderId, orderId, amount){
  const r = rider(riderId), h = hub(r.hub), R = st.rules;
  if(amount < 1) return {err:'Enter an amount to request.'};
  if(r.topupToday + pendingFor(riderId) + amount > R.dailyCap)
    return {err:`This would take you past today's top-up limit of ${inr(R.dailyCap)}. You have ${inr(Math.max(0,R.dailyCap - r.topupToday - pendingFor(riderId)))} left.`};
  if(amount > h.balance) return {err:'Your hub is out of funds right now. Your manager has been alerted.'};
  const q = {id:uid('Q'), rider:riderId, order:orderId, amount, status:'pending', at:new Date().toISOString()};
  st.requests.unshift(q);
  if(amount <= R.autoLimit && !r.autoFrozen){ approve(q.id,'Auto-approved'); return {ok:'approved', q}; }
  audit(r.name, `Requested ${inr(amount)} top-up for ${orderId}`);
  return {ok:'pending', q};
}
function approve(qid, by, amount){
  const q = st.requests.find(x=>x.id===qid); const r = rider(q.rider); const h = hub(r.hub);
  if(amount && amount < q.amount){ q.requested = q.amount; q.amount = amount; }
  if(h.balance < q.amount){ toast(`${h.name} wallet has only ${inr(h.balance)}. Ask HQ to fund the hub.`,true); return false; }
  h.balance -= q.amount; r.balance += q.amount; r.topupToday += q.amount;
  q.status='approved'; q.by=by; q.doneAt=new Date().toISOString();
  addTxn('topup', q.amount, {hub:h.id, rider:r.id, order:q.order, by});
  notify(r.id, by==='Auto-load' ? `${inr(q.amount)} loaded automatically for ${q.order}.` : by==='Auto-approved' ? `${inr(q.amount)} top-up approved instantly for ${q.order}.` : `${by} approved your ${inr(q.amount)} top-up for ${q.order}.`);
  audit(by, `Approved ${inr(q.amount)} top-up for ${r.name}`);
  return true;
}
function reject(qid, by, reason){
  const q = st.requests.find(x=>x.id===qid); const r = rider(q.rider);
  q.status='rejected'; q.by=by; q.reason=reason||'No reason given'; q.doneAt=new Date().toISOString();
  notify(r.id, `${by} declined your ${inr(q.amount)} top-up: "${q.reason}". Call your hub for help.`);
  audit(by, `Declined ${inr(q.amount)} top-up for ${r.name}: ${q.reason}`);
}
function payStore(orderId, amount){
  const o = order(orderId), r = rider(o.rider);
  if(amount < 1) return {err:'Enter the bill amount.'};
  if(amount > r.balance) return {err:`This bill is ${inr(amount - r.balance)} more than your balance. Request a top-up to continue.`, short: amount - r.balance};
  r.balance -= amount; o.paidAmt = amount; o.status='paid'; o.paidAt = new Date().toISOString();
  const utr = newUtr();
  addTxn('payment', amount, {hub:r.hub, rider:r.id, order:o.id, store:o.store, payee:o.store.toUpperCase(), utr, upiNote:o.id});
  return {ok:true, utr};
}
function markNoBill(orderId){
  const o = order(orderId); o.noBill = true; o.billAmt = null; o.billImg = null; o.billAI = null; o.status = 'billed';
  const tx = st.txns.find(x=>x.type==='payment' && x.order===orderId);
  audit(rider(o.rider).name, `Paid ${o.store} for ${orderId} without a bill; matched by order ID (UPI ref ${tx?.utr||'n/a'})`);
  return tx;
}
function submitBill(orderId, billAmt, img){
  const o = order(orderId); o.billAmt = billAmt; o.billImg = img; o.billAI = null; o.noBill = false; o.status='billed';
  const t = st.txns.find(x=>x.type==='payment' && x.order===orderId);
  return reconOf(t);
}
function finishDelivery(orderId, collected, method){
  const o = order(orderId), r = rider(o.rider);
  if(o.cod){ const amt = collected ?? o.codAmount; if(amt>0){ if(method==='cash') addTxn('cod_cash', amt, {hub:r.hub, rider:r.id, order:o.id}); else { hub(r.hub).balance += amt; addTxn('cod', amt, {hub:r.hub, rider:r.id, order:o.id}); } } }
  o.status='delivered';

const STORES = ['Sai Kirana Stores','Fresh Mart','Patel Provisions','Om Sweets','Krishna Dairy','Green Basket'];
function newOrder(riderId, est0, codForce){
  const id = 'QD-' + (48240 + Math.floor(Math.random()*700));
  const est = est0 || Math.round((300 + Math.random()*3200)/10)*10;
  const cod = codForce!=null ? codForce : (cashHeld(rider(riderId)) >= st.rules.cashLimit ? false : Math.random()<.35);
  st.orders.push({id, rider:riderId, store:STORES[Math.floor(Math.random()*STORES.length)], estimate:est, status:'assigned', cod, codAmount: cod? est+60 : 0, paidAmt:null, billAmt:null, billImg:null});

/* ---------- Auto-load: fund riders the moment an order is assigned ---------- */
function riderCommitted(r, uptoId){ const list = st.orders.filter(o=>o.rider===r.id && o.status==='assigned'); const idx = uptoId ? list.findIndex(o=>o.id===uptoId) : list.length-1; return list.slice(0, idx+1).reduce((a,o)=>a+o.estimate,0); }
function autoLoad(riderId, orderId){
  const R = st.rules; if(!R.autoLoad) return null;
  const r = rider(riderId), o = order(orderId), h = hub(r.hub);
  if(!o || o.status!=='assigned' || r.status!=='active' || r.kyc!=='verified') return null;
  if(st.requests.some(q=>q.order===orderId && q.status==='pending')) return null;
  const need = Math.ceil((riderCommitted(r, orderId)*(1+R.autoLoadBuffer/100) - r.balance - pendingFor(r.id))/50)*50;
  if(need<=0) return null;
  const now = new Date().toISOString();
  const withinCap = r.topupToday + pendingFor(r.id) + need <= R.dailyCap;
  if(need <= R.autoLoadMax && !r.autoFrozen && withinCap && need <= h.balance){
    const q = {id:uid('Q'), rider:r.id, order:orderId, amount:need, status:'pending', at:now, auto:true};
    st.requests.unshift(q);
    if(approve(q.id, 'Auto-load')){ o.autoLoaded = (o.autoLoaded||0) + need; return {ok:'loaded', amt:need}; }
    st.requests.shift(); return null;
  }
  const why = r.autoFrozen ? 'auto-approvals are paused for this rider' : !withinCap ? 'it would pass the daily limit' : need > h.balance ? 'the hub wallet is low' : `it is above the ${inr(R.autoLoadMax)} auto-load limit`;
  const q = {id:uid('Q'), rider:r.id, order:orderId, amount:need, status:'pending', at:now, auto:true, autoWhy:why};
  st.requests.unshift(q);
  audit('QD Wallet', `Auto-raised ${inr(need)} for ${r.name} on ${orderId}: ${why}`);
  notify(r.id, `${orderId} needs ${inr(need)} more. Sent to ${h.manager} automatically.`);
  return {ok:'raised', amt:need, q};
}
function autoLoadAll(){
  st.riders.filter(r=>r.status==='active').forEach(r=>{
    st.orders.filter(o=>o.rider===r.id && o.status==='assigned').forEach(o=>autoLoad(r.id, o.id));
  });
}
function allocate(riderId, amount, by){
  const r = rider(riderId), h = hub(r.hub);
  if(amount<1) return toast('Enter an amount to allocate.',true), false;
  if(r.status!=='active') return toast(`${r.name} is inactive.`,true), false;
  if(amount > h.balance) return toast(`Hub wallet has only ${inr(h.balance)}.`,true), false;
  h.balance -= amount; r.balance += amount;
  addTxn('allocate', amount, {hub:h.id, rider:r.id, by});
  notify(r.id, `${by} added ${inr(amount)} to your wallet.`);
  return true;
}
function sweepRider(r, by){
  if(r.balance<=0) return 0;
  const a = r.balance; hub(r.hub).balance += a; r.balance = 0;
  addTxn('sweep', a, {hub:r.hub, rider:r.id, by});
  return a;
}
function fundHub(hubId, amount){
  const h = hub(hubId); h.balance += amount;
  addTxn('fund_hub', amount, {hub:hubId, by:'Anil M. (HQ)'});
  audit('Anil M. (HQ)', `Funded ${h.name} with ${inr(amount)}`);
}

const TX_LABEL = {fund_hub:'Hub funded', allocate:'Float added', topup:'Top-up', payment:'Paid', cod:'COD by UPI', cod_cash:'COD cash collected', cash_deposit:'Cash handed in', cash_banked:'Cash banked', sweep:'Returned to hub'};

function smooth(pts){

  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const cx=(x0+x1)/2; d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`; }

}
function areaCum(hours){

  const max = Math.max(1,...cum.flat());
  const x = i => pl + i*(W-pl-pr)/(hours.length-1); const y = v => pt + (1-v/max)*(H-pt-pb);
  const grid = [0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#EEF0F6"/><text x="${pl-8}" y="${y(max*f)+4}" text-anchor="end" class="ax">${max*f>=1000?(max*f/1000).toFixed(max*f>=10000?0:1)+'k':Math.round(max*f)}</text>`).join('');

      <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4.5" fill="#fff" stroke="${c}" stroke-width="2.5"><title>${l}: ${inr(cum[si][cum[si].length-1])}</title></circle>`; }).join('');

}
function sankey(m){

    {id:'hub',l:'Hub wallets',c:1,col:'#3B348F'},{id:'rcash',l:'Cash with riders',c:1,col:C_AMBER},
    {id:'rw',l:'Rider wallets',c:2,col:C_VIO},{id:'kept',l:'Kept in hub',c:2,col:C_SLATE},{id:'handed',l:'Handed in',c:2,col:C_TEAL2},{id:'still',l:'Still with riders',c:2,col:C_RED2},
    {id:'spent',l:'Spent at stores',c:3,col:C_OK},{id:'idle',l:'Unspent float',c:3,col:C_SAFF},{id:'ret',l:'Returned',c:3,col:C_SLATE}];
  const links = [['hq','hub',m.funded],['upi','hub',m.codUpi+m.codLinked],['cashc','rcash',m.codCash],['hub','rw',given],['hub','kept',kept],['rcash','handed',cashIn],['rcash','still',cashHeldV],
    ['rw','spent',m.spent],['rw','idle',Math.max(0,m.withRiders)],['rw','ret',m.returned]].filter(l=>l[2]>0).map(([s,t_,v])=>({s,t:t_,v}));
  const W=760, H=300, nw=12, pad=14, colX=[0,240,480,W-nw-130];
  const N = Object.fromEntries(nodes.map(n=>[n.id,{...n,in:0,out:0}]));
  links.forEach(l=>{ N[l.s].out+=l.v; N[l.t].in+=l.v; });
  const live = Object.values(N).filter(n=>Math.max(n.in,n.out)>0);
  // scale: compress large values with sqrt so small flows stay visible
  const sc = v => Math.sqrt(v);
  const cols = [0,1,2,3].map(c=>live.filter(n=>n.c===c));
  const colTotal = c => cols[c].reduce((a,n)=>a+sc(Math.max(n.in,n.out)),0);
  const k = Math.min(...[0,1,2,3].filter(c=>cols[c].length).map(c=>(H-pad*(cols[c].length-1))/colTotal(c)));
  cols.forEach((list,c)=>{ let yy = 0; const tot = list.reduce((a,n)=>a+sc(Math.max(n.in,n.out))*k,0) + pad*(list.length-1); yy = (H-tot)/2;
    list.forEach(n=>{ n.h = Math.max(4, sc(Math.max(n.in,n.out))*k); n.y = yy; n.x = colX[c]; n.oy = 0; n.iy = 0; yy += n.h + pad; }); });
  const bands = links.map(l=>{ const a = N[l.s], b = N[l.t]; const ha = a.h * (l.v/Math.max(a.out,1)), hb = b.h * (l.v/Math.max(b.in,1));

    return `<path class="band" d="M${x0} ${y0} C${cx} ${y0} ${cx} ${y1} ${x1} ${y1} L${x1} ${y1+hb} C${cx} ${y1+hb} ${cx} ${y0+ha} ${x0} ${y0+ha}Z" fill="${a.col}" opacity=".28"><title>${a.l} → ${b.l}: ${inr(l.v)}</title></path>`; }).join('');

function scorecard2(m){
  const R = (phase,kpi,actual,disp,target,tdisp,better) => { const ok = better==='higher' ? actual>=target : actual<=target; return {phase,kpi,disp,tdisp,ok, prog: better==='higher' ? Math.min(100, target? actual/target*100 : 100) : Math.min(100, actual ? target/actual*100 : 100)}; };
  const rows = [
    R(1,'Store payments made digitally',100,'100%',80,'80%','higher'), R(1,'Bills uploaded for payments',m.billRate,m.billRate+'%',95,'95%','higher'), R(1,'Top-up turnaround',m.tatMedian??0,fmtSecs(m.tatMedian),300,'< 5 min','lower'),
    R(2,'Top-up turnaround',m.tatMedian??0,fmtSecs(m.tatMedian),60,'< 60 sec','lower'), R(2,'Payments auto-matched',m.autoMatch,m.autoMatch+'%',90,'90%','higher'), R(2,'Requests needing a manager',m.manualRate,m.manualRate+'%',15,'< 15%','lower'),
    R(2,'Cash variance',+m.variancePct.toFixed(2),m.variancePct.toFixed(2)+'%',0.5,'< 0.5%','lower'), R(2,'COD collected digitally',m.digitalCod,m.digitalCod+'%',60,'60%','higher'),
    R(3,'Riders over cash limit',m.overCash,String(m.overCash),0,'0','lower'), R(3,'Idle float per rider',m.idleFloat,inr(m.idleFloat),1500,'< ₹1,500','lower')];
  const on = rows.filter(r=>r.ok).length;
  const phases = [1,2,3].map(p=>({p, rows:rows.filter(r=>r.phase===p)}));
  const names = {1:'Go digital',2:'Automate and control',3:'Optimize with data'};
  return `<div class="panel scorecard"><div class="ph"><div><h2>Success metrics from the proposal</h2><p class="small muted">${on} of ${rows.length} on target today</p></div>${ring(on/rows.length*100, C_PRIM, 52)}</div>
    <div class="phase-cols">${phases.map(({p,rows:rs})=>`<div class="phase-col ph${p}"><div class="pc-h"><span class="phase-tag p${p}">Phase ${p}</span><b>${names[p]}</b><span class="small muted">${rs.filter(r=>r.ok).length}/${rs.length}</span></div>
      ${rs.map(r=>`<div class="pc-row"><div class="pc-top"><span>${r.kpi}</span><b class="${r.ok?'ok-t':'bad-t'}">${r.disp}</b></div><div class="track tgt"><div class="fill" style="width:${Math.max(4,r.prog)}%;background:${r.ok?C_OK:C_RED2}"></div></div><div class="pc-t">Target ${r.tdisp}${r.ok?' <span class="ok-t">on target</span>':''}</div></div>`).join('')}</div>`).join('')}</div></div>`;
}

function exCard(i, hid){

  return `<article class="xc s-${i.status}">
    <div class="xtop"><div><span class="kind">${KIND[i.kind]}</span><h3>${esc(i.title)}</h3><div class="small muted">${i.rider?esc(rider(i.rider).name):'No rider'}${i.facts.length?', '+i.facts.map(esc).join(', '):''}</div></div>

  </article>`;
}

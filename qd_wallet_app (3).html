const isAutoQ = q => q.by==='Auto-approved' || q.by==='Auto-load';
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
const fmtSecs = s => s==null ? '–' : s<60 ? `${Math.round(s)} sec` : s<3600 ? `${Math.round(s/60)} min` : `${(s/3600).toFixed(1)} h`;
const pctOf = (a,b) => b ? Math.round(a/b*100) : 0;
function metrics(scope){
  const hids = scope==='HQ' ? st.hubs.map(h=>h.id) : [scope];
  const inH = t => hids.includes(t.hub);
  const riders = st.riders.filter(r=>hids.includes(r.hub));
  const tx = st.txns.filter(inH);
  const sum = ty => tx.filter(t=>t.type===ty).reduce((a,t)=>a+t.amount,0);
  const pays = tx.filter(t=>t.type==='payment');
  const reqs = st.requests.filter(q=>hids.includes(rider(q.rider)?.hub));
  const decided = reqs.filter(q=>q.status!=='pending' && q.doneAt);
  const approved = decided.filter(q=>q.status==='approved');
  const tats = approved.map(q=>Math.max(1,(new Date(q.doneAt)-new Date(q.at))/1000));
  const items = hids.flatMap(h=>hubExceptions(h));
  const flaggedPays = pays.filter(t=>paymentFlags(t).length);
  const paidOrders = st.orders.filter(o=>o.paidAmt!=null && hids.includes(rider(o.rider).hub));
  const billed = paidOrders.filter(o=>o.billAmt!=null);
  const codOrders = st.orders.filter(o=>o.cod && o.status==='delivered' && hids.includes(rider(o.rider).hub));
  const codExpected = codOrders.reduce((a,o)=>a+o.codAmount,0);
  const codUpi = sum('cod'), codCash = sum('cod_cash');
  const codLinked = st.credits.filter(c=>hids.includes(c.hub) && c.linked).reduce((a,c)=>a+c.amount,0);
  const cash = hids.map(hubCash).reduce((a,c)=>{ Object.keys(c).forEach(k=>a[k]=(a[k]||0)+c[k]); return a; },{});
  const funded = sum('fund_hub'), spent = sum('payment');
  const ledgerVar = riders.reduce((a,r)=>a+Math.abs(riderLedger(r).diff),0) + hids.reduce((a,h)=>a+Math.abs(hubLedger(hub(h)).diff),0) + Math.abs(cash.short||0) + Math.max(0,codExpected-codUpi-codCash-codLinked);
  const flow = funded + codUpi + codCash;
  // hourly activity, last 8 hours
  const now = Date.now(); const hours = [];
  for(let i=7;i>=0;i--){
    const start = now - (i+1)*3600000, end = now - i*3600000;
    const inB = t => { const x = new Date(t.at).getTime(); return x>=start && x<end; };
    hours.push({label: new Date(end).toLocaleTimeString('en-IN',{hour:'2-digit',hour12:false})+':00', spend: pays.filter(inB).reduce((a,t)=>a+t.amount,0), topup: tx.filter(t=>t.type==='topup' && inB(t)).reduce((a,t)=>a+t.amount,0), cod: tx.filter(t=>(t.type==='cod'||t.type==='cod_cash') && inB(t)).reduce((a,t)=>a+t.amount,0)});
  }
  const byKind = {}; items.forEach(i=>{ byKind[i.kind] = (byKind[i.kind]||0)+1; });
  const checked = pays.length + codOrders.length + st.credits.filter(c=>hids.includes(c.hub)).length + riders.length*2 + st.deposits.filter(d=>hids.includes(d.hub)).length;
  return {
    hids, riders, pays, reqs, decided, items, funded, spent, codOrders, codExpected, codUpi, codCash, codLinked, cash, checked,
    tatMedian: median(tats), autoRate: pctOf(decided.filter(q=>isAutoQ(q)).length, decided.length),
    manualRate: pctOf(decided.filter(q=>q.by && !isAutoQ(q)).length, decided.length),
    autoMatch: pctOf(pays.length - flaggedPays.length, pays.length), billRate: pctOf(billed.length, paidOrders.length),
    digitalCod: pctOf(codUpi + codLinked, codUpi + codCash + codLinked), variancePct: flow ? (ledgerVar/flow*100) : 0, ledgerVar,
    idleFloat: riders.length ? Math.round(riders.reduce((a,r)=>a+Math.max(0,r.balance),0)/riders.length) : 0,
    overCash: riders.filter(r=>cashHeld(r) > st.rules.cashLimit).length,
    allocated: sum('allocate'), topups: sum('topup'), withRiders: riders.reduce((a,r)=>a+r.balance,0), hubWallets: hids.reduce((a,h)=>a+hub(h).balance,0), returned: sum('sweep'),
    resolved: items.filter(i=>i.status==='resolved').length, open: items.filter(i=>i.status!=='resolved').length,
    byKind, hours, alerts: st.notes.filter(n=>n.kind==='mismatch' && hids.includes(rider(n.rider)?.hub)).length
  };
}
const C_GREEN='#0E5A42', C_MARI='#F2B000', C_RED='#C2313B', C_PURP='#5B3FA8', C_GREY='#B9C6C0', C_TEAL='#3E8E7E';
function donut(segs, center, sub){
  const total = segs.reduce((a,s)=>a+s.value,0) || 1; const R=54, C=2*Math.PI*R; let off=0;
  const arcs = segs.filter(s=>s.value>0).map(s=>{ const len = s.value/total*C; const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(s.label)}: ${esc(s.display||s.value)}</title></circle>`; off+=len; return el; }).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(segs.map(s=>s.label+' '+(s.display||s.value)).join(', '))}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#EEF2F0" stroke-width="18"/>${arcs}
    <text x="70" y="68" text-anchor="middle" class="dc">${esc(center)}</text><text x="70" y="86" text-anchor="middle" class="ds">${esc(sub||'')}</text></svg>
    <ul class="legend-l">${segs.map(s=>`<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${esc(s.display??s.value)}</b></li>`).join('')}</ul></div>`;
}
function columns(hours){
  const W=640, H=210, pad=34, bw=(W-pad*2)/hours.length; const max = Math.max(1,...hours.map(h=>h.spend+h.topup+h.cod));
  const y = v => H-28 - v/max*(H-50);
  const bars = hours.map((h,i)=>{ const x = pad+i*bw+bw*0.18, w = bw*0.64; let base = H-28; const seg = (v,c,l)=>{ if(!v) return ''; const top = y(v + (H-28-base===0?0:0)); const hgt = v/max*(H-50); base -= hgt; return `<rect x="${x}" y="${base}" width="${w}" height="${hgt}" fill="${c}" rx="2"><title>${h.label} ${l}: ${inr(v)}</title></rect>`; };
    return seg(h.spend,C_GREEN,'store spend') + seg(h.topup,C_MARI,'top-ups') + seg(h.cod,C_PURP,'COD collected') + `<text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="ax">${h.label}</text>`; }).join('');
  const grid = [0,0.5,1].map(f=>`<line x1="${pad}" x2="${W-pad}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#E3E9E6"/><text x="${pad-6}" y="${y(max*f)+4}" text-anchor="end" class="ax">${max*f>=1000?Math.round(max*f/1000)+'k':Math.round(max*f)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="colchart" role="img" aria-label="Money movement by hour">${grid}${bars}</svg>
    <div class="legend-h"><span><i style="background:${C_GREEN}"></i>Store spend</span><span><i style="background:${C_MARI}"></i>Top-ups</span><span><i style="background:${C_PURP}"></i>COD collected</span></div>`;
}

function insightFallback(m){
  const out = [];
  out.push({title:'Riders are funded in seconds', insight:`Median top-up turnaround is ${fmtSecs(m.tatMedian)}, and ${m.autoRate}% of requests were approved automatically. Riders no longer ride back to the hub for cash.`, action:'Keep the ₹2,000 auto-approve limit under review.'});
  const topKind = Object.entries(m.byKind).sort((a,b)=>b[1]-a[1])[0];
  if(topKind) out.push({title:`${KIND[topKind[0]]} drives most exceptions`, insight:`${topKind[1]} of ${m.items.length} exceptions are ${KIND[topKind[0]].toLowerCase()} items. ${m.autoMatch}% of store payments still match with no human involved.`, action:'Coach riders on the most common cause.'});
  out.push(m.cash.withRiders>0 ? {title:'Cash in hand is the open risk', insight:`${inr(m.cash.withRiders)} in COD cash is still with riders and ${m.overCash} rider${m.overCash===1?' is':'s are'} over the limit. Only ${m.digitalCod}% of COD was collected digitally.`, action:'Nudge customers toward UPI at checkout.'}
    : {title:'Cash is fully accounted for', insight:`No COD cash is outstanding with riders. ${m.digitalCod}% of COD was collected digitally.`, action:'Push digital COD to reduce cash handling.'});
  return out.slice(0,3);
}

function makeReceipt(store, total, oid){
  const c = document.createElement('canvas'); c.width=420; c.height=600; const g = c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,420,600); g.fillStyle='#222'; g.textAlign='center';
  g.font='bold 26px sans-serif'; g.fillText(store.toUpperCase(),210,56);
  g.font='16px sans-serif'; g.fillText('Andheri East, Mumbai 400069',210,82); g.fillText('GSTIN 27ABCDE1234F1Z5',210,104);
  g.fillText(new Date().toLocaleDateString('en-IN')+'  '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),210,128);
  g.textAlign='left'; g.font='17px monospace';
  const items = [['Aashirvaad Atta 5kg',0.32],['Amul Butter 500g',0.18],['Tata Salt 1kg',0.04],['Toor Dal 2kg',0.28],['Fortune Oil 1L',0.18]];
  let y=180, run=0; items.forEach(([n,f],i)=>{ const v = i===items.length-1 ? total-run : Math.round(total*f); run+=v; g.fillText(n,30,y); g.textAlign='right'; g.fillText(v.toFixed(2),390,y); g.textAlign='left'; y+=34; });
  g.fillRect(30,y,360,2); y+=40; g.font='bold 24px monospace'; g.fillText('TOTAL',30,y); g.textAlign='right'; g.fillText('Rs '+total.toFixed(2),390,y);
  g.textAlign='center'; g.font='15px sans-serif'; g.fillText('Paid by UPI. Ref '+oid,210,y+50); g.fillText('Thank you, visit again',210,y+76);
  return c.toDataURL('image/jpeg',0.8);
}
async function ensurePaidBilled(oid){
  const o = order(oid), r = rider(o.rider);
  if(o.status==='assigned'){
    if(r.balance < o.estimate){
      let q = st.requests.find(x=>x.order===oid && x.status==='pending');
      if(!q){ const res = requestTopup(r.id, oid, o.estimate - r.balance); q = res.ok==='pending' ? res.q : null; }
      if(q && q.status==='pending') approve(q.id, hub(r.hub).manager);
    }
    if(r.balance >= o.estimate) payStore(oid, o.estimate);
  }
  if(o.status==='paid'){ submitBill(oid, o.paidAmt, makeReceipt(o.store, o.paidAmt, oid)); o.billAI = await readBill(o); }
}

  if(!f.length) param = {title:t('rMatched',{},L), body:t('rMatchedBody',{p:inr(o.paidAmt), b:inr(o.billAmt)},L)+' '+aiLine, next:null};
  else {
    const i = hubExceptions(r.hub).find(x=>x.key===tx.id); const msg = riderMessageFor(i);
    if(st.settings.autoAlert) sendRiderAlert(i, msg);
    param = {kind:'warnk', title:t('rMismatch',{},L), body:aiLine, note:msg, noteKind:'n-bad', next:{v:'reply',p:tx.id,label:t('replyNow',{},L)}};
  }
  if(ui.screen==='busy' && ui.role==='rider'){ ui.param = param; ui.screen='result'; }
  commit();
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v, p = el.dataset.p;
  const r = rider(ui.rider);
  switch(a){
    case 'role': ui.role=v; ui.rejecting=null; ui.askOpen=false; if(v==='rider') ui.screen='home'; render(); window.scrollTo(0,0); break;
    case 'intro': ui.role='intro'; render(); window.scrollTo(0,0); break;
    case 'storystart': ui.story.on=true; ui.story.j='day'; ui.story.min=false; ui.story.done={}; storyGo(0); window.scrollTo(0,0); break;
    case 'journey': ui.story.on=true; ui.story.j=v; ui.story.min=false; ui.story.done={}; storyGo(0); window.scrollTo(0,0); break;
    case 'storyfinish': { const lbl = JOURNEYS[ui.story.j||'day'].label; ui.story.on=false; ui.role='intro'; render(); document.getElementById('personas')?.scrollIntoView({block:'start'}); toast(`${lbl} complete. Pick another persona.`); break; }
    case 'storynext': storyGo(ui.story.step+1); break;
    case 'storyprev': storyGo(ui.story.step-1); break;
    case 'storyauto': storyAuto(); break;
    case 'storymin': ui.story.min = !ui.story.min; render(); break;
    case 'storyend': ui.story.on=false; render(); break;
    case 'insights': genInsights(v); break;
    case 'reset': if(confirm('Reset all demo data?')){ seq=1000; st=seed(); autoLoadAll(); ui.screen='home'; commit(); toast('Demo data reset'); } break;
    /* rider */
    case 'go': goRider(v, p, {prefill: el.dataset.amt ? num(el.dataset.amt) : null}); break;
    case 'neworder': { const id = newOrder(r.id); const o = order(id); const pq = st.requests.find(q=>q.order===id && q.status==='pending'); commit(); toast(o.autoLoaded ? t('newLoaded',{o:id, a:inr(o.autoLoaded)}) : pq ? t('newRaised',{o:id}) : t('newOrder',{o:id})); break; }
    case 'sendtopup': {
      if(r.kyc!=='verified'){ ui.err='Complete your KYC before you can receive funds.'; render(); break; }
      const amt = num(val('tu-amt')); const res = requestTopup(r.id, p, amt);
      if(res.err){ ui.err=res.err; ui.prefill=amt; render(); break; }
      if(res.ok==='approved') ui.param = {title:t('rAdded',{a:inr(amt)}), body:t('rAddedBody',{b:inr(r.balance)}), next:{v:'pay',p,label:t('payStore')}};
      else ui.param = {kind:'wait', title:t('rSent',{m:hub(r.hub).manager}), body:t('rSentBody',{a:inr(amt),o:p}), note:t('rSentNote'), noteKind:'n-warn'};
      ui.screen='result'; commit(); break;
    }
    case 'scanned': ui.payStage='amount'; render(); break;
    case 'pay': {
      const amt = num(val('pay-amt')); const res = payStore(p, amt);
      if(res.err){ ui.err=res.err; ui.short=res.short||null; ui.prefill=amt; render(); break; }
      ui.param = {title:t('rPaid',{a:inr(amt)}), body:t('rPaidBody',{s:order(p).store, b:inr(r.balance)}) + ' ' + t('linkedRef',{o:p, u:res.utr}), note:t('rPaidNote2'), noteKind:'n-warn', next:{v:'bill',p,label:t('uploadBill')}};
      ui.screen='result'; commit(); break;
    }
    case 'submitbill': {
      if(!ui.billImg){ ui.err='Add a photo of the bill to continue.'; render(); break; }

      submitBill(p, amt, ui.billImg); ui.billImg=null; save();

      readBill(order(p)).then(ai=>{ order(p).billAI = ai; afterBill(p); });
      break;
    }
    case 'deliver': finishDelivery(p); commit(); toast(t('delivered',{o:p})); break;
    case 'codpaid': {
      const o=order(p); const amt=num(val('cod-amt'));
      if(!amt){ ui.err='Enter the amount the customer paid.'; render(); break; }
      const method = (ui.codMethod==='cashdiff' || ui.codMethod==='cash') ? 'cash' : 'upi'; finishDelivery(p, amt, method); ui.codMethod = 'upi';
      if(amt===o.codAmount && method==='cash'){ const held = cashHeld(r);
        ui.param={title:t('cashRecv'), body:t('rCashBody',{a:inr(amt),o:p,h:inr(held)}), note: held>st.rules.cashLimit?t('rCashOver',{l:inr(st.rules.cashLimit)}):t('rCashNote'), noteKind: held>st.rules.cashLimit?'n-bad':'n-warn', next:{v:'deposit',label:t('deposit')}}; }
      else if(amt===o.codAmount) ui.param={title:t('rPayRecv'), body:t('rPayRecvBody',{a:inr(amt),o:p})};
      else { const i = hubExceptions(r.hub).find(x=>x.key==='COD:'+p); const msg = riderMessageFor(i); if(st.settings.autoAlert) sendRiderAlert(i, msg);
        ui.param={kind:'warnk', title:t('rShort',{a:inr(o.codAmount-amt)}), body:t('rShortBody',{a:inr(amt),e:inr(o.codAmount),o:p}), note:msg, noteKind:'n-bad', next:{v:'reply',p:'COD:'+p,label:t('explainNow')}}; }
      ui.screen='result'; commit(); break;
    }
    case 'codm': ui.codMethod = v; render(); break;
    case 'nobill': {
      const o = order(p); if(!o || o.status!=='paid') break;
      const tx = markNoBill(p); const f = paymentFlags(tx);
      if(f.length){ const i = hubExceptions(r.hub).find(x=>x.key===tx.id); const msg = riderMessageFor(i); if(st.settings.autoAlert && i) sendRiderAlert(i, msg);
        ui.param = {kind:'warnk', title:t('nbFlagTitle'), body:t('linkedRef',{o:p, u:tx.utr}), note:msg, noteKind:'n-warn', next:{v:'reply',p:tx.id,label:t('replyNow')}}; }

      ui.billImg=null; ui.screen='result'; commit(); break;
    }
    case 'codcash': {
      const o = order(p); if(!o || o.status!=='billed') break;
      finishDelivery(p, o.codAmount, 'cash'); ui.codMethod='upi';
      const held = cashHeld(r);
      ui.param = {title:t('cashRecv'), body:t('rCashAuto',{a:inr(o.codAmount), o:p, h:inr(held)}), note: held>st.rules.cashLimit ? t('rCashOver',{l:inr(st.rules.cashLimit)}) : t('rCashNote'), noteKind: held>st.rules.cashLimit?'n-bad':'n-warn', next:{v:'deposit', label:t('deposit')}};
      ui.screen='result'; commit(); break;
    }
    case 'setlang': { r.lang = v; ui.rlang = v; audit(r.name, `Switched app language to ${LANGS[v].name}`); commit(); break; }
    case 'trnote': { const n = st.notes[+p]; if(n){ el.textContent='…'; translateNote(n, rLang()); } break; }
    case 'deposit': {
      const amt = num(val('dep-amt')); const held = cashHeld(r);

      const d = {id:uid('D'), code:'D-'+(4500+Math.floor(Math.random()*500)), rider:r.id, hub:r.hub, declared:amt, counted:null, status:'pending', at:new Date().toISOString()};
      st.deposits.push(d); audit(r.name, `Handed in ${inr(amt)} cash (${d.code})`);
      ui.param = {title:t('rCode',{c:d.code}), body:t('rCodeBody',{a:inr(amt),m:hub(r.hub).manager})}; ui.screen='result'; commit(); break;
    }
    case 'countdep': {
      const d = st.deposits.find(x=>x.id===p); const cnt = num(val('cnt-'+p)); const by = hub(ui.hub).manager; const rr = rider(d.rider);
      if(val('cnt-'+p)==='' ){ toast('Enter the amount you counted.',true); break; }
      d.counted = cnt; d.status='confirmed'; d.confirmedAt = new Date().toISOString(); d.by = by;
      addTxn('cash_deposit', cnt, {hub:d.hub, rider:d.rider, by});
      audit(by, `Counted ${inr(cnt)} from ${rr.name} (${d.code}, declared ${inr(d.declared)})`);
      if(cnt===d.declared){ notify(d.rider, `${by} counted your ${inr(cnt)} cash deposit (${d.code}). All matched.`); toast(`${inr(cnt)} counted and matched`); }
      else { const i = hubExceptions(d.hub).find(x=>x.key==='DEP:'+d.id); if(st.settings.autoAlert && i) sendRiderAlert(i, riderMessageFor(i)); toast(`${inr(Math.abs(d.declared-cnt))} difference recorded${st.settings.autoAlert?'. Rider alerted.':''}`, true); }
      commit(); break;
    }
    case 'bankdep': {
      const amt = num(val('bank-amt')), ref = val('bank-ref').trim(), C = hubCash(ui.hub), by = hub(ui.hub).manager;
      if(!amt || amt > C.safe){ toast(`Enter an amount up to ${inr(C.safe)} in the safe.`,true); break; }
      if(ref.length<3){ toast('Enter the deposit slip number.',true); break; }
      st.banked.push({hub:ui.hub, amount:amt, ref, at:new Date().toISOString(), by});
      addTxn('cash_banked', amt, {hub:ui.hub, by}); audit(by, `Banked ${inr(amt)} cash, slip ${ref}`); commit(); toast(`${inr(amt)} recorded as banked`); break;
    }
    case 'sendreply': {
      const text = val('reply-text').trim(); const i = hubExceptions(r.hub).find(x=>x.key===p);
      if(!i){ goRider('alerts'); break; }
      if(text.length<3 && !ui.billImg){ ui.err='Tell your manager what happened, or add a new bill photo.'; ui.replyText=text; render(); break; }
      i.rec.riderReply = {text: text || 'Uploaded a new bill photo.', at:new Date().toISOString(), newBill:!!ui.billImg};
      audit(r.name, `Replied to mismatch on ${i.title}`); translateReply(i.rec);
      const done = () => { ui.replyText=''; ui.param={title:t('replySent'), body:t('rReplyBody',{m:hub(r.hub).manager})}; ui.screen='result'; commit(); };
      if(ui.billImg && i.kind==='payment'){
        const o = order(i.order); o.billImg = ui.billImg; o.billAmt = num(val('reply-amt')) || o.billAmt; o.billAI = null; ui.billImg=null;
        ui.screen='busy'; ui.param=t('checkingNew'); render();
        readBill(o).then(ai=>{ o.billAI = ai; if(!paymentFlags(st.txns.find(t=>t.type==='payment'&&t.order===o.id)).length){ i.rec.status='resolved'; i.rec.resolution='Matched after new bill'; i.rec.at=new Date().toISOString(); } done(); });
      } else done();
      break;
    }

    /* hub */
    case 'hubtab': ui.hubTab=v; ui.rejecting=null; render(); window.scrollTo(0,0); if(v==='ask') scrollChat(); break;
    case 'closemode': ui.closeMode=v; render(); break;
    case 'recmode': ui.recMode=v; render(); break;
    case 'scrollto': document.getElementById(v)?.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); break;
    case 'askopen': ui.askOpen=true; render(); scrollChat(); document.getElementById('ask-in')?.focus(); break;
    case 'askclose': ui.askOpen=false; render(); break;
    case 'approve': { const q = st.requests.find(x=>x.id===p); if(approve(p, hub(ui.hub).manager)) toast(`Approved ${inr(q.amount)} for ${rider(q.rider).name}`); commit(); break; }
    case 'reject': ui.rejecting=p; render(); document.getElementById('rj-'+p)?.focus(); break;
    case 'rejectcancel': ui.rejecting=null; render(); break;
    case 'rejectconfirm': { const reason = val('rj-'+p).trim(); if(!reason){ toast('Add a reason so the rider knows what to do.',true); break; } reject(p, hub(ui.hub).manager, reason); ui.rejecting=null; commit(); toast('Request declined'); break; }
    case 'allocate': { const rr = rider(p); if(rr.kyc!=='verified'){ toast(`${rr.name} hasn't completed KYC yet.`,true); break; } const amt=num(val('al-'+p)); if(allocate(p, amt, hub(ui.hub).manager)){ toast(`Added ${inr(amt)} to ${rr.name}`); audit(hub(ui.hub).manager, `Allocated ${inr(amt)} to ${rr.name}`); commit(); } break; }
    case 'bulk': {
      const amt=num(val('bulk-amt')); const list = st.riders.filter(x=>x.hub===ui.hub && x.status==='active' && x.kyc==='verified');
      if(!amt){ toast('Enter an amount per rider.',true); break; }
      if(amt*list.length > hub(ui.hub).balance){ toast(`That needs ${inr(amt*list.length)}, but the hub wallet has ${inr(hub(ui.hub).balance)}.`,true); break; }
      list.forEach(x=>allocate(x.id, amt, hub(ui.hub).manager)); audit(hub(ui.hub).manager, `Allocated ${inr(amt)} each to ${list.length} riders`);
      commit(); toast(`Added ${inr(amt)} to ${list.length} riders`); break;
    }
    case 'sweep1': { const rr=rider(p); const a2 = sweepRider(rr, hub(ui.hub).manager); audit(hub(ui.hub).manager, `Returned ${inr(a2)} from ${rr.name} to hub`); commit(); toast(`${inr(a2)} returned to hub wallet`); break; }
    case 'txf': ui.txFilter=v; render(); break;
    case 'rf': ui.reconFilter=v; render(); break;
    case 'runai': {
      const hid = ui.hub; ui.aiBusy = true; render();
      runAiMatching(hid).then(res=>{ ui.aiBusy=false; commit(); if(res.count) toast(`${res.engine==='Claude'?'AI':'Rules'} reviewed ${res.count} item${res.count>1?'s':''}, ${res.alerted} rider alert${res.alerted===1?'':'s'} sent`); });
      break;
    }
    case 'applyhigh': {
      const hid = ui.hub; const by = hub(hid).manager+' (AI suggestion)'; let n=0;
      hubExceptions(hid).filter(i=>i.status!=='resolved' && i.rec.ai && i.rec.ai.confidence>=st.rules.aiConfidence && ['accept','link','reversal'].includes(i.rec.ai.action) && i.rec.ai.verdict!=='mismatch')
        .forEach(i=>{ if(applyAction(hid, i.key, i.rec.ai.action, by, {note:'Accepted: '+i.rec.ai.explanation})) n++; });
      commit(); toast(`Applied ${n} suggestion${n===1?'':'s'}`); break;
    }
    case 'xact': { if(applyAction(ui.hub, p, v, hub(ui.hub).manager, {note:el.dataset.note})) commit(); break; }
    case 'xlink': { if(applyAction(ui.hub, p, 'link', hub(ui.hub).manager, {to:val('lk-'+p)})){ commit(); toast('Credit linked'); } break; }
    case 'xai': { const rec = st.recon[p]; if(rec && rec.ai && applyAction(ui.hub, p, rec.ai.action, hub(ui.hub).manager+' (AI suggestion)', {to:rec.ai.link_to, msg:rec.ai.rider_message, note:'Accepted: '+rec.ai.explanation})) commit(); break; }
    case 'signoff': {
      const h = hub(ui.hub); let total=0;
      st.riders.filter(x=>x.hub===h.id).forEach(x=> total += sweepRider(x, 'End-of-day sweep'));
      h.signedOff = new Date().toISOString();
      audit(h.manager, `Signed off ${h.name}; ${inr(total)} returned from riders`);
      commit(); toast(`Day signed off. ${inr(total)} returned to the hub wallet.`); break;
    }
    /* hq */
    case 'hqtab': ui.hqTab=v; render(); window.scrollTo(0,0); if(v==='ask') scrollChat(); break;
    case 'approvepart': { const q = st.requests.find(x=>x.id===p); const amt = num(el.dataset.amt); if(approve(p, hub(ui.hub).manager+' (co-pilot)', amt)){ notify(q.rider, `Approved ${inr(amt)} of your ${inr(q.requested)} request for ${q.order}: that covers the order.`); toast(`Approved ${inr(amt)} for ${rider(q.rider).name}`); } commit(); break; }
    case 'rejectai': { const q = st.requests.find(x=>x.id===p); reject(p, hub(ui.hub).manager, q.ai?.decline_message || 'Declined after review'); commit(); toast('Request declined'); break; }
    case 'asksend': case 'askchip': { const qn = a==='askchip' ? v : val('ask-in').trim(); if(!qn || ui.askBusy) break; askData(ui.role==='hq'?'HQ':ui.hub, qn); break; }
    case 'rlang': r.lang=v; ui.rlang=v; commit(); break;
    case 'rsend': case 'rchip': { const qn = a==='rchip' ? v : val('rask-in').trim(); if(!qn) break; riderAsk(r, qn); break; }
    case 'mic': {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) break;
      const rec = new SR(); rec.lang = LANGS[ui.rlang].speech; rec.interimResults = false;
      rec.onresult = ev => { const t = ev.results[0][0].transcript; ui.listening=false; riderAsk(rider(ui.rider), t); };
      rec.onerror = () => { ui.listening=false; render(); toast('Could not hear that. Try typing instead.', true); };
      rec.onend = () => { if(ui.listening){ ui.listening=false; render(); } };
      ui.listening=true; render(); rec.start(); break;
    }
    case 'riskrun': runRiskReview(); break;
    case 'freeze': { const rr = rider(p); rr.autoFrozen = true; const c = st.riskRun?.cases.find(x=>x.id===el.dataset.k); if(c) c.status='actioned'; audit('Anil M. (HQ)', `Paused auto-approvals for ${rr.name}`); commit(); toast(`Auto-approvals paused for ${rr.name}. Their top-ups now go to the hub manager.`); break; }
    case 'unfreeze': { const rr = rider(p); rr.autoFrozen = false; audit('Anil M. (HQ)', `Resumed auto-approvals for ${rr.name}`); commit(); toast(`Auto-approvals resumed for ${rr.name}`); break; }
    case 'casedone': { const c = st.riskRun.cases.find(x=>x.id===p); c.status = v; audit('Anil M. (HQ)', `${v==='dismissed'?'Dismissed':'Actioned'} risk case: ${c.title} (${rider(c.rider).name})`); commit(); break; }
    case 'fund': { const amt=num(val('fund-amt')); const hid=val('fund-hub'); if(!amt){ toast('Enter an amount to transfer.',true); break; } fundHub(hid, amt); commit(); toast(`${inr(amt)} transferred to ${hub(hid).name}`); break; }
    case 'savepol': {
      const n = {autoLimit:num(val('pol-auto')), dailyCap:num(val('pol-cap')), tolerancePct:num(val('pol-tol')), matchWithin:num(val('pol-match')), aiConfidence:Math.min(100,Math.max(50,num(val('pol-ai')))), cashLimit:num(val('pol-cash'))||5000, cashAgeHours:st.rules.cashAgeHours, autoLoad:!!document.getElementById('pol-al')?.checked, autoLoadMax:num(val('pol-almax'))||3000, autoLoadBuffer:Math.min(25,num(val('pol-albuf'))), noBillMax:num(val('pol-nobill'))||2000};
      if(!n.autoLimit || !n.dailyCap){ toast('Limits must be greater than zero.',true); break; }
      if(n.autoLimit > n.dailyCap){ toast("The auto-approve limit can't be higher than the daily limit.",true); break; }
      st.rules = n; audit('Anil M. (HQ)', `Updated policies: auto-approve ${inr(n.autoLimit)}, daily limit ${inr(n.dailyCap)}, flag over ${n.tolerancePct}%, auto-load ${n.autoLoad?'on up to '+inr(n.autoLoadMax)+' with '+n.autoLoadBuffer+'% buffer':'off'}`); if(n.autoLoad) autoLoadAll();
      commit(); toast('Policies saved'); break;
    }
    /* admin */
    case 'onboard': {
      const name = val('nr-name').trim(), phone = val('nr-phone').replace(/\D/g,'');
      if(name.length<3){ toast('Enter the rider\'s full name.',true); break; }
      if(phone.length!==10){ toast('Enter a 10-digit mobile number.',true); break; }
      const id = uid('R'); st.riders.push({id, name, hub:val('nr-hub'), phone: phone.slice(0,5)+' '+phone.slice(5), balance:0, topupToday:0, status:'active', kyc:'pending'});
      audit('IT admin', `Onboarded ${name} at ${hub(val('nr-hub')).name}`); commit(); toast(`${name} added. KYC link sent by SMS.`); break;
    }
    case 'kyc': { const rr=rider(p); rr.kyc='verified'; audit('IT admin', `Verified KYC for ${rr.name}`); commit(); toast(`${rr.name} verified`); break; }
    case 'deactivate': { const rr=rider(p); if(!confirm(`Deactivate ${rr.name}? Their ${inr(rr.balance)} balance returns to the hub.`)) break; const a2=sweepRider(rr,'Deactivation'); rr.status='inactive'; audit('IT admin', `Deactivated ${rr.name}; ${inr(a2)} returned to hub`); commit(); toast(`${rr.name} deactivated`); break; }
    case 'reactivate': { const rr=rider(p); rr.status='active'; audit('IT admin', `Reactivated ${rr.name}`); commit(); break; }
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && ui.askOpen){ ui.askOpen=false; render(); return; }
  if(e.key!=='Enter') return;
  if(e.target.id==='ask-in'){ e.preventDefault(); document.querySelector('[data-act=asksend]')?.click(); }
  if(e.target.id==='rask-in'){ e.preventDefault(); document.querySelector('[data-act=rsend]')?.click(); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='sel-rider'){ ui.rider=e.target.value; goRider('home'); }
  if(e.target.id==='autoalert'){ st.settings.autoAlert = e.target.checked; commit(); toast(e.target.checked?'Riders will be alerted automatically':'Automatic rider alerts are off'); }
  if(e.target.id==='sel-hub'){ ui.hub=e.target.value; ui.rejecting=null; render(); }
  if(e.target.id==='bill-file'){
    const f = e.target.files[0]; if(!f) return;
    const amtNow = val('bill-amt'); if(document.getElementById('reply-text')) ui.replyText = val('reply-text');
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 640/Math.max(img.width,img.height)); const c = document.createElement('canvas');
      c.width = img.width*s; c.height = img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      ui.billImg = c.toDataURL('image/jpeg',.6); ui.err=null; render();
      const bi = document.getElementById('bill-amt'); if(bi && amtNow) bi.value = amtNow;
    }; img.src = rd.result; };
    rd.readAsDataURL(f);
  }
});

load().then(()=>{ if(!ui.restored) autoLoadAll(); render(); });
